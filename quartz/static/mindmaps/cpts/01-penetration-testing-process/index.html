<body>
  <svg id="mindmap"></svg>
  <script>
    const data = {"content":"Penetration Testing Process","children":[{"content":"&#x1f3af; Main Idea","children":[{"content":"Introduces what a penetration test is: an organized, targeted, and authorized attack to find vulnerabilities and improve a client&apos;s security.","children":[],"payload":{"tag":"li","lines":"2,3"}},{"content":"Distinguishes pentests (manual + automated, tailored) from automated vulnerability assessments and goal-based red team assessments.","children":[],"payload":{"tag":"li","lines":"3,4"}},{"content":"Defines a flexible, stage-based methodology (not a step-by-step recipe) that adapts to each unique environment.","children":[],"payload":{"tag":"li","lines":"4,5"}},{"content":"Covers the legal, contractual, and ethical framework that authorizes and bounds all testing.","children":[],"payload":{"tag":"li","lines":"5,7"}}],"payload":{"tag":"h2","lines":"1,2"}},{"content":"&#x1f4a5; Attack / Exploit Vectors","children":[{"content":"1. Pre-Engagement","children":[{"content":"Educate the client, define scope, and lock everything into contracts before any testing.","children":[],"payload":{"tag":"li","lines":"9,10"}},{"content":"Key artifacts: NDA, Goals, Scope, Time Estimation, Rules of Engagement, authorization/&quot;get out of jail&quot; documents.","children":[],"payload":{"tag":"li","lines":"10,12"}}],"payload":{"tag":"h3","lines":"8,9"}},{"content":"2. Information Gathering","children":[{"content":"Obtain information about the target company, software, and hardware via active and passive means.","children":[],"payload":{"tag":"li","lines":"13,14"}},{"content":"Goal: find potential security gaps and a path to a foothold.","children":[],"payload":{"tag":"li","lines":"14,16"}}],"payload":{"tag":"h3","lines":"12,13"}},{"content":"3. Vulnerability Assessment","children":[{"content":"Analyze gathered data to find known vulnerabilities in systems, apps, and versions.","children":[],"payload":{"tag":"li","lines":"17,18"}},{"content":"Combines manual analysis with automated scanners (Nessus, Qualys, OpenVAS) to rate threat level.","children":[],"payload":{"tag":"li","lines":"18,20"}}],"payload":{"tag":"h3","lines":"16,17"}},{"content":"4. Exploitation","children":[{"content":"Test and execute attacks against identified vectors to gain initial access.","children":[],"payload":{"tag":"li","lines":"21,23"}}],"payload":{"tag":"h3","lines":"20,21"}},{"content":"5. Post-Exploitation","children":[{"content":"Maintain access, escalate privileges to highest rights, and hunt sensitive data (pillaging).","children":[],"payload":{"tag":"li","lines":"24,25"}},{"content":"Demonstrate impact of access to the client.","children":[],"payload":{"tag":"li","lines":"25,27"}}],"payload":{"tag":"h3","lines":"23,24"}},{"content":"6. Lateral Movement","children":[{"content":"Move through the internal network to reach additional hosts at same or higher privilege.","children":[],"payload":{"tag":"li","lines":"28,29"}},{"content":"Iterative with post-exploitation; chains credentials/data to go deeper.","children":[],"payload":{"tag":"li","lines":"29,31"}}],"payload":{"tag":"h3","lines":"27,28"}},{"content":"7. Proof-of-Concept","children":[{"content":"Document step-by-step how weaknesses were chained to reach the objective.","children":[],"payload":{"tag":"li","lines":"32,33"}},{"content":"Optionally script the steps so the client can reproduce findings and prioritize remediation.","children":[],"payload":{"tag":"li","lines":"33,35"}}],"payload":{"tag":"h3","lines":"31,32"}},{"content":"8. Post-Engagement","children":[{"content":"Produce formal deliverables/report, clean up all traces, hold report walkthrough and executive presentation.","children":[],"payload":{"tag":"li","lines":"36,37"}},{"content":"Archive data per contract; perform retest after remediation.","children":[],"payload":{"tag":"li","lines":"37,39"}}],"payload":{"tag":"h3","lines":"35,36"}}],"payload":{"tag":"h2","lines":"7,8"}},{"content":"&#x1f6e0;&#xfe0f; Key Tools &amp; Concepts","children":[{"content":"Pentest vs. Vulnerability Assessment &#x2014; tailored manual+automated testing vs. purely automated scanning.","children":[],"payload":{"tag":"li","lines":"40,41"}},{"content":"Risk Management &#x2014; accept, transfer, avoid, or mitigate risk; inherent residual risk always remains.","children":[],"payload":{"tag":"li","lines":"41,42"}},{"content":"Testing perspectives &#x2014; External (internet perimeter) vs. Internal (inside corporate network / assumed breach).","children":[],"payload":{"tag":"li","lines":"42,43"}},{"content":"Testing types &#x2014; Blackbox (minimal info), Greybox (extended), Whitebox (full disclosure), Red-Teaming, Purple-Teaming.","children":[],"payload":{"tag":"li","lines":"43,44"}},{"content":"Testing environments &#x2014; Network, Web App, Mobile, API, Thick Clients, IoT, Cloud, Source Code, Physical, Employees.","children":[],"payload":{"tag":"li","lines":"44,45"}},{"content":"Trusted-advisor role &#x2014; report vulns and remediation; client (not tester) applies fixes.","children":[],"payload":{"tag":"li","lines":"45,46"}},{"content":"Snapshot in time &#x2014; a pentest is a momentary security snapshot, not continuous monitoring.","children":[],"payload":{"tag":"li","lines":"46,48"}}],"payload":{"tag":"h2","lines":"39,40"}},{"content":"&#x1f6e1;&#xfe0f; Mitigations","children":[{"content":"Authorization required &#x2014; testing only on client-owned assets with explicit written approval (third parties need separate approval).","children":[],"payload":{"tag":"li","lines":"49,50"}},{"content":"Legal compliance &#x2014; honor Data Protection Act / privacy; keep discovered personal data confidential.","children":[],"payload":{"tag":"li","lines":"50,51"}},{"content":"Remediation guidance &#x2014; recommend password changes, encryption of sensitive data, and appropriate security controls/policies.","children":[],"payload":{"tag":"li","lines":"51,52"}}],"payload":{"tag":"h2","lines":"48,49"}}],"payload":{"tag":"h1","lines":"0,1"}}
    const { Markmap, Toolbar, globalCSS } = window.markmap

  </script>
