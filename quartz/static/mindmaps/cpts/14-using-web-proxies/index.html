],"payload":{"tag":"li","lines":"10,16"}}],"payload":{"tag":"h3","lines":"8,9"}},{"content":"Intercepting Requests","children":[{"content":"Pause outbound requests to modify them before they reach the server (e.g. bypass front-end JS validation, inject <code>;ls;<\/code> into an <code>ip<\/code> param &#x2192; command injection).","children":[],"payload":{"tag":"li","lines":"17,18"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"Burp <code>Proxy &gt; Intercept<\/code> (on by default)","children":[],"payload":{"tag":"li","lines":"19,20"}},{"content":"ZAP toggle intercept <code>CTRL+B<\/code>, or HUD step/continue","children":[],"payload":{"tag":"li","lines":"20,22"}}],"payload":{"tag":"li","lines":"18,22"}}],"payload":{"tag":"h3","lines":"16,17"}},{"content":"Intercepting Responses","children":[{"content":"Pause server responses to edit HTML before the browser renders it: <code>type=&quot;number&quot;<\/code>&#x2192;<code>type=&quot;text&quot;<\/code>, <code>maxlength=&quot;3&quot;<\/code>&#x2192;<code>maxlength=&quot;100&quot;<\/code>, unhide hidden fields, enable disabled buttons.","children":[],"payload":{"tag":"li","lines":"23,24"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"Burp <code>Proxy &gt; Proxy settings &gt; Response modification rules<\/code> &#x2192; <code>Unhide hidden form fields<\/code>","children":[],"payload":{"tag":"li","lines":"25,26"}},{"content":"ZAP HUD one-click Show/Enable fields","children":[],"payload":{"tag":"li","lines":"26,28"}}],"payload":{"tag":"li","lines":"24,28"}}],"payload":{"tag":"h3","lines":"22,23"}},{"content":"Automatic Modification (Match &amp; Replace)","children":[{"content":"Auto-apply rules to every request/response instead of intercepting the same change repeatedly.","children":[],"payload":{"tag":"li","lines":"29,30"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"Burp <code>Proxy &gt; Proxy settings &gt; HTTP match and replace rules<\/code> &#x2014; e.g. Request header, match <code>^User-Agent.*&#x24;<\/code>, replace <code>User-Agent: HackTheBox Agent 1.0<\/code>, Regex: True","children":[],"payload":{"tag":"li","lines":"31,32"}},{"content":"Burp response body rule &#x2014; match <code>type=&quot;number&quot;<\/code> replace <code>type=&quot;text&quot;<\/code>","children":[],"payload":{"tag":"li","lines":"32,33"}},{"content":"ZAP <code>Replacer<\/code> (<code>CTRL+R<\/code>) &#x2014; Match Type <code>Request Header (will add if not present)<\/code>, string <code>User-Agent<\/code>","children":[],"payload":{"tag":"li","lines":"33,35"}}],"payload":{"tag":"li","lines":"30,35"}}],"payload":{"tag":"h3","lines":"28,29"}},{"content":"Repeating Requests (Repeater)","children":[{"content":"Resend and tweak any prior request without re-intercepting; quickly change HTTP method.","children":[],"payload":{"tag":"li","lines":"36,37"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"Burp Repeater &#x2014; <code>CTRL+R<\/code> send to Repeater, <code>CTRL+SHIFT+R<\/code> go to Repeater","children":[],"payload":{"tag":"li","lines":"38,39"}},{"content":"ZAP <code>Open/Resend with Request Editor<\/code> / HUD Replay in Console/Browser","children":[],"payload":{"tag":"li","lines":"39,41"}}],"payload":{"tag":"li","lines":"37,41"}}],"payload":{"tag":"h3","lines":"35,36"}},{"content":"Encoding / Decoding","children":[{"content":"Built-in encoders/decoders to craft payloads: URL, HTML, Unicode, Base64, ASCII hex (e.g. decode a base64 cookie, change guest&#x2192;admin / false&#x2192;true, re-encode).","children":[],"payload":{"tag":"li","lines":"42,43"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"Burp URL-encode selection <code>CTRL+U<\/code>, URL-decode <code>CTRL+SHIFT+U<\/code>; Burp Decoder / Inspector","children":[],"payload":{"tag":"li","lines":"44,45"}},{"content":"ZAP Encoder/Decoder/Hash <code>CTRL+E<\/code>","children":[],"payload":{"tag":"li","lines":"45,47"}}],"payload":{"tag":"li","lines":"43,47"} ase/Beta/Alpha), e.g. FuzzDB wordlists","children":[],"payload":{"tag":"li","lines":"81,83"}}],"payload":{"tag":"li","lines":"79,83"}}],"payload":{"tag":"h3","lines":"77,78"}}],"payload":{"tag":"h2","lines":"7,8"}},{"content":"&#x1f6e0;&#xfe0f; Key Tools &amp; Concepts","children":[{"content":"Burp Suite &#x2014; most common proxy; Community free, Pro unlocks Active Scanner, fast Intruder","children":[],"payload":{"tag":"li","lines":"84,85"}},{"content":"OWASP ZAP &#x2014; free open-source proxy; no paywall/throttling; unique in-browser HUD","children":[],"payload":{"tag":"li","lines":"85,86"}},{"content":"Web Proxy / MITM &#x2014; intercepts HTTP/80 &amp; HTTPS/443 (vs Wireshark which sniffs all traffic)","children":[],"payload":{"tag":"li","lines":"86,87"}},{"content":"proxychains &#x2014; forces any CLI tool through a proxy via <code>/etc/proxychains.conf<\/code>","children":[],"payload":{"tag":"li","lines":"87,88"}},{"content":"FoxyProxy &#x2014; Firefox extension to switch proxy profiles quickly","children":[],"payload":{"tag":"li","lines":"88,89"}},{"content":"CA Certificate &#x2014; proxy cert in browser trust store to decrypt HTTPS cleanly","children":[],"payload":{"tag":"li","lines":"89,90"}},{"content":"Target Scope &#x2014; regex include/exclude to focus features &amp; scans","children":[],"payload":{"tag":"li","lines":"90,91"}},{"content":"Crawler/Spider &#x2014; maps site via links/forms (ZAP Ajax Spider also follows JS); does not fuzz unreferenced pages","children":[],"payload":{"tag":"li","lines":"91,92"}},{"content":"Passive vs Active Scan &#x2014; passive analyzes seen responses; active sends payloads to verify real vulns","children":[],"payload":{"tag":"li","lines":"92,93"}},{"content":"Severity / Confidence &#x2014; prioritize High + Certain/Firm findings","children":[],"payload":{"tag":"li","lines":"93,94"}},{"content":"ZAP HUD &#x2014; in-browser overlay controlling ZAP&apos;s core features","children":[],"payload":{"tag":"li","lines":"94,96"}}],"payload":{"tag":"h2","lines":"83,84"}},{"content":"&#x1f6e1;&#xfe0f; Mitigations (only if the module covers them)","children":[{"content":"Never rely on client-side (front-end JS/HTML) validation &#x2014; proxies trivially bypass it; enforce all validation server-side.","children":[],"payload":{"tag":"li","lines":"97,98"}}],"payload":{"tag":"h2","lines":"96,97"}}],"payload":{"tag":"h1","lines":"0,1"}}
