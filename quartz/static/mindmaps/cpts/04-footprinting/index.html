# Footprinting
## 🎯 Main Idea
- Teaches a structured enumeration methodology to understand a target's infrastructure rather than just forcing a way in ("find all the ways in, not just get in").
- Covers infrastructure-based, host-based, and OS-based enumeration across a 6-layer model (Internet Presence → Gateway → Accessible Services → Processes → Privileges → OS Setup).
- Deep-dives service-by-service enumeration of common network protocols to extract info, misconfigs, and footholds.

## 💥 Attack / Exploit Vectors
### Infrastructure-based Enumeration (Internet Presence)
- Discover domains, subdomains, netblocks, ASN, and cloud instances passively.
- **Commands**
  - `curl -s https://crt.sh/\?q\=<target-domain>\&output\=json | jq .` — Certificate transparency lookup
  - `for i in $(cat ip-addresses.txt);do shodan host $i;done` — Scan each IP via Shodan

### FTP (21)
- Enumerate anonymous access, banners, and downloadable files.
- **Commands**
  - `ftp <FQDN/IP>` — Interact with FTP
  - `nc -nv <FQDN/IP> 21` — Interact/banner grab
  - `telnet <FQDN/IP> 21` — Interact with FTP
  - `openssl s_client -connect <FQDN/IP>:21 -starttls ftp` — Encrypted FTP connection
  - `wget -m --no-passive ftp://anonymous:anonymous@<target>` — Mirror all files anonymously

### SMB (139/445)
- Null-session enumeration of shares, users, and RPC info.
- **Commands**
  - `smbclient -N -L //<FQDN/IP>` — Null-session share listing
  - `smbclient //<FQDN/IP>/<share>` — Connect to a share
  - `rpcclient -U "" <FQDN/IP>` — RPC interaction
  - `samrdump.py <FQDN/IP>` — Username enumeration (Impacket)
  - `smbmap -H <FQDN/IP>` — Enumerate shares
  - `crackmapexec smb <FQDN/IP> --shares -u '' -p ''` — Share enum via null session
  - `enum4linux-ng.py <FQDN/IP> -A` — Full SMB enumeration

### NFS (2049)
- List and mount exported shares to read files.
- **Commands**
  - `showmount -e <FQDN/IP>` — Show available NFS shares
  - `mount -t nfs <FQDN/IP>:/<share> ./target-NFS/ -o nolock` — Mount a share
  - `umount ./target-NFS` — Unmount the share

### DNS (53)
- Query records and attempt zone transfers / subdomain brute forcing.
- **Commands**
  - `dig ns <domain.tld> @<nameserver>` — NS records
  - `dig any <domain.tld> @<nameserver>` — ANY records
  - `dig axfr <domain.tld> @<nameserver>` — Zone transfer (AXFR)
  - `dnsenum --dnsserver <nameserver> --enum -p 0 -s 0 -o found_subdomains.txt -f ~/subdomains.list <domain.tld>` — Subdomain brute force

### SMTP (25)
- Banner grab and user/command enumeration (VRFY/EXPN/RCPT).
- **Commands**
  - `telnet <FQDN/IP> 25` — Interact with the SMTP service

### IMAP / POP3 (143/993, 110/995)
- Authenticate and read mail over cleartext/TLS.
- **Commands**
  - `curl -k 'imaps://<FQDN/IP>' --user <user>:<password>` — Log in to IMAPS via cURL
  - `openssl s_client -connect <FQDN/IP>:imaps` — Connect to IMAPS
  - `openssl s_client -connect <FQDN/IP>:pop3s` — Connect to POP3s

### SNMP (161)
- Walk OIDs and brute-force community strings for config/secrets.
- **Commands**
  - `snmpwalk -v2c -c <community string> <FQDN/IP>` — Query OIDs
  - `onesixtyone -c community-strings.list <FQDN/IP>` — Brute-force community strings
  - `braa <community string>@<FQDN/IP>:.1.*` — Brute-force OIDs

### MySQL (3306)
- Authenticate and enumerate databases.
- **Commands**
  - `mysql -u <user> -p<password> -h <FQDN/IP>` — Log in to MySQL

### MSSQL (1433)
- Authenticate (incl. Windows auth) and interact.
- **Commands**
  - `mssqlclient.py <user>@<FQDN/IP> -windows-auth` — Log in with Windows auth

### Oracle TNS (1521)
- Enumerate SID/components and leverage DB for file read/write.
- **Commands**
  - `./odat.py all -s <FQDN/IP>` — Broad Oracle service enumeration
  - `sqlplus <user>/<pass>@<FQDN/IP>/<db>` — Log in to the Oracle DB
  - `./odat.py utlfile -s <FQDN/IP> -d <db> -U <user> -P <pass> --sysdba --putFile C:\\insert\\path file.txt ./file.txt` — Upload a file via Oracle RDBMS

### IPMI (623)
- Version detection and hash dumping for offline cracking.
- **Commands**
  - `msf6 auxiliary(scanner/ipmi/ipmi_version)` — IPMI version detection
  - `msf6 auxiliary(scanner/ipmi/ipmi_dumphashes)` — Dump IPMI hashes

### Linux Remote Management (SSH 22)
- Audit SSH config and authenticate via password or key.
- **Commands**
  - `ssh-audit.py <FQDN/IP>` — Remote SSH security audit
  - `ssh <user>@<FQDN/IP>` — Log in via SSH client
  - `ssh -i private.key <user>@<FQDN/IP>` — Log in with a private key
  - `ssh <user>@<FQDN/IP> -o PreferredAuthentications=password` — Force password auth

### Windows Remote Management (RDP 3389, WinRM 5985/5986, WMI 135)
- Check RDP security and gain remote command execution.
- **Commands**
  - `rdp-sec-check.pl <FQDN/IP>` — Check RDP security settings
  - `xfreerdp /u:<user> /p:"<password>" /v:<FQDN/IP>` — RDP login from Linux
  - `evil-winrm -i <FQDN/IP> -u <user> -p <password>` — Log in to WinRM
  - `wmiexec.py <user>:"<password>"@<FQDN/IP> "<system command>"` — Execute a command via WMI

## 🛠️ Key Tools & Concepts
- Enumeration principles — "there's more than meets the eye"; distinguish what you can and cannot see; always ways to learn more.
- 3 levels / 6 layers — Infrastructure, Host, and OS-based enumeration mapped across the layered methodology.
- OSINT vs. enumeration — OSINT is strictly passive and separate from active enumeration.
- Cloud resources & staff — identify cloud storage/instances and use OSINT on employees.
- Core tooling — crt.sh, Shodan, smbclient/smbmap/enum4linux-ng, rpcclient, Impacket, dig/dnsenum, snmpwalk/onesixtyone/braa, odat, evil-winrm.

## 🛡️ Mitigations
- Disable anonymous FTP and SMB null sessions; restrict share permissions.
- Restrict NFS exports (no_root_squash off, proper host ACLs) and avoid world-readable shares.
- Disable DNS zone transfers (AXFR) to untrusted hosts.
- Replace default SNMP community strings and prefer SNMPv3 with authentication.
- Use strong DB credentials, least privilege, and disable risky features (Oracle utl_file).
- Harden SSH (key-only auth), RDP (NLA/TLS), and WinRM; patch and segment management interfaces.
