usa HTTP basic auth","children":[],"payload":{"tag":"li","lines":"35,36"}},{"content":"<code>hydra ... http-get<\/code> &#x2014; Hydra HTTP basic auth via http-get module","children":[],"payload":{"tag":"li","lines":"36,38"}}],"payload":{"tag":"li","lines":"34,38"}}],"payload":{"tag":"h3","lines":"32,33"}},{"content":"Login Form Brute Forcing","children":[{"content":"Target HTML POST login forms, detecting success/failure by a response string.","children":[],"payload":{"tag":"li","lines":"39,40"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>hydra -l admin -P /path/to/password_list.txt 127.0.0.1 http-post-form &quot;/login.php:user=^USER^&amp;pass=^PASS^:F=incorrect&quot;<\/code> &#x2014; POST form; <code>^USER^<\/code>/<code>^PASS^<\/code> substituted, <code>F=<\/code> failure string (use <code>S=<\/code> for success string)","children":[],"payload":{"tag":"li","lines":"41,43"}}],"payload":{"tag":"li","lines":"40,43"}}],"payload":{"tag":"h3","lines":"38,39"}},{"content":"Medusa - Parallel Brute Forcer","children":[{"content":"Fast, modular, massively-parallel login brute-forcer across many services.","children":[],"payload":{"tag":"li","lines":"44,45"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>medusa [-h host|-H file] [-u username|-U file] [-p password|-P file] [-C file] -M module [OPT]<\/code> &#x2014; general syntax","children":[],"payload":{"tag":"li","lines":"46,47"}},{"content":"<code>medusa -h 192.168.1.100 -u admin -P passwords.txt -M ssh<\/code> &#x2014; brute-force SSH","children":[],"payload":{"tag":"li","lines":"47,48"}},{"content":"<code>medusa -h 192.168.1.100 -U users.txt -P passwords.txt -M ftp -t 5<\/code> &#x2014; FTP with 5 parallel threads","children":[],"payload":{"tag":"li","lines":"48,49"}},{"content":"<code>medusa -h 192.168.1.100 -u admin -P passwords.txt -M rdp<\/code> &#x2014; brute-force RDP","children":[],"payload":{"tag":"li","lines":"49,50"}},{"content":"<code>medusa -h 192.168.1.10 ,"payload":{"tag":"li","lines":"59,68"}}],"payload":{"tag":"h3","lines":"57,58"}},{"content":"Password Policy Filtering","children":[{"content":"Trim a wordlist to only passwords matching the target&apos;s policy, cutting wasted guesses.","children":[],"payload":{"tag":"li","lines":"69,70"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>grep -E &apos;^.{8,}&#x24;&apos; wordlist.txt<\/code> &#x2014; minimum length (8+)","children":[],"payload":{"tag":"li","lines":"71,72"}},{"content":"<code>grep -E &apos;[A-Z]&apos; wordlist.txt<\/code> &#x2014; at least one uppercase","children":[],"payload":{"tag":"li","lines":"72,73"}},{"content":"<code>grep -E &apos;[0-9]&apos; wordlist.txt<\/code> &#x2014; at least one digit","children":[],"payload":{"tag":"li","lines":"73,74"}},{"content":"<code>grep -v -i &apos;password&apos; wordlist.txt<\/code> &#x2014; exclude common pattern &quot;password&quot;","children":[],"payload":{"tag":"li","lines":"74,75"}},{"content":"<code>grep -E &apos;(.)\\1&apos; wordlist.txt<\/code> &#x2014; find consecutive repeated chars (invert with <code>grep -v<\/code>)","children":[],"payload":{"tag":"li","lines":"75,76"}},{"content":"<code>grep -E &apos;^.{8,}&#x24;&apos; wordlist.txt | grep -E &apos;[A-Z]&apos;<\/code> &#x2014; combine multiple policy requirements","children":[],"payload":{"tag":"li","lines":"76,78"}}],"payload":{"tag":"li","lines":"70,78"}}],"payload":{"tag":"h3","lines":"68,69"}}],"payload":{"tag":"h2","lines":"7,8"}},{"content":"&#x1f6e0;&#xfe0f; Key Tools &amp; Concepts","children":[{"content":"Hydra &#x2014; fast parallel multi-protocol login cracker; <code>-l<\/code>/<code>-L<\/code> user, <code>-p<\/code>/<code>-P<\/code> pass, <code>-C<\/code> combo, http-post-form","children":[],"payload":{"tag":"li","lines":"79,80"}},{"content":"Medusa &#x2014; modular parallel brute-forcer; <code>-M<\/code> module, <code>-t<\/code> threads, <code>-f<\/code> stop on first hit","children":[],"payload":{"tag":"li","line
