    const data = {"content":"Attacking Web Applications with Ffuf","children":[{"content":"&#x1f3af; Main Idea","children":[{"content":"Learn to use <code>ffuf<\/code> for fast web fuzzing to discover hidden content and inputs on web apps.","children":[],"payload":{"tag":"li","lines":"2,3"}},{"content":"Enumerate directories, files, extensions, parameters, and values a site does not link to.","children":[],"payload":{"tag":"li","lines":"3,4"}},{"content":"Discover DNS sub-domains and virtual hosts (VHosts) that share an IP.","children":[],"payload":{"tag":"li","lines":"4,5"}},{"content":"Filter and tune results to cut noise and zero in on valid responses.","children":[],"payload":{"tag":"li","lines":"5,7"}}],"payload":{"tag":"h2","lines":"1,2"}},{"content":"&#x1f4a5; Attack / Exploit Vectors","children":[{"content":"Web Fuzzing Basics","children":[{"content":"Replace the part of a request to test with the <code>FUZZ<\/code> keyword and feed it a wordlist with <code>-w<\/code>.","children":[],"payload":{"tag":"li","lines":"9,10"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>ffuf -h<\/code> &#x2014; show ffuf help/options","children":[],"payload":{"tag":"li","lines":"11,12"}},{"content":"<code>ffuf -w wordlist.txt:FUZZ -u http://SERVER_IP:PORT/FUZZ<\/code> &#x2014; basic fuzz at FUZZ position","children":[],"payload":{"tag":"li","lines":"12,14"}}],"payload":{"tag":"li","lines":"10,14"}}],"payload":{"tag":"h3","lines":"8,9"}},{"content":"Directory Fuzzing","children":[{"content":"Brute-force directory/folder names to find unlinked paths.","children":[],"payload":{"tag":"li","lines":"15,16"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>ffuf -w wordlist.txt:FUZZ -u http://SERVER_IP:PORT/FUZZ<\/code> &#x2014; directory fuzzing","children":[],"payload":{"tag":"li","lines":"17,18"}},{"content":"<code>/opt/useful/seclists/Discovery/Web-Content/directory-list-2.3-small.txt<\/code> &#x2014; directory/page wordlist","children":[],"payload":{"tag":"li","lines":"18,20"}}],"payload":{"tag":"li","lines":"16,20"}}],"payload":{"tag":"h3","lines":"14,15"}},{"content":"Extension Fuzzing","children":[{"content":"Discover which file extensions the server serves (.php, .html, .bak, etc.).","children":[],"payload":{"tag":"li","lines":"21,22"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>ffuf -w wordlist.txt:FUZZ -u http://SERVER_IP:PORT/indexFUZZ<\/code> &#x2014; fuzz the extension after a known filename","children":[],"payload":{"tag":"li","lines":"23,24"}},{"content":"<code>/opt/useful/seclists/Discovery/Web-Content/web-extensions.txt<\/code> &#x2014; extensions wordlist","children":[],"payload":{"tag":"li","lines":"24,26"}}],"payload":{"tag":"li","lines":"22,26"}}],"payload":{"tag":"h3","lines":"20,21"}},{"content":"Page Fuzzing","children":[{"content":"Enumerate page/file names within a known directory using a known extension.","children":[],"payload":{"tag":"li","lines":"27,28"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>ffuf -w wordlist.txt:FUZZ -u http://SERVER_IP:PORT/blog/FUZZ.php<\/code> &#x2014; page fuzzing","children":[],"payload":{"tag":"li","lines":"29,31"}}],"payload":{"tag":"li","lines":"28,31"}}],"payload":{"tag":"h3","lines":"26,27"}},{"content":"Recursive Fuzzing","children":[{"content":"Automatically fuzz newly found directories to a set depth instead of repeating manually.","children":[],"payload":{"tag":"li","lines":"32,33"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>ffuf -w wordlist.txt:FUZZ -u http://SERVER_IP:PORT/FUZZ -recursion -recursion-depth 1 -e .php -v<\/code> &#x2014; recursive fuzz, depth 1, append .php, verbose","children":[],"payload":{"tag":"li","lines":"34,36"}}],"payload":{"tag":"li","lines":"33,36"}}],"payload":{"tag":"h3","lines":"31,32"}},{"content":"DNS Records / Sub-domain Fuzzing","children":[{"content":"Brute-force sub-domains of a target domain by fuzzing the host portion.","children":[],"payload":{"tag":"li","lines":"37,38"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>ffuf -w wordlist.txt:FUZZ -u https://FUZZ.hackthebox.eu/<\/code> &#x2014; sub-domain fuzzing","children":[],"payload":{"tag":"li","lines":"39,40"}},{"content":"<code>/opt/useful/seclists/Discovery/DNS/subdomains-top1million-5000.txt<\/code> &#x2014; DNS/subdomain wordlist","children":[],"payload":{"tag":"li","lines":"40,42"}}],"payload":{"tag":"li","lines":"38,42"}}],"payload":{"tag":"h3","lines":"36,37"}},{"content":"VHost Fuzzing","children":[{"content":"Finds virtual hosts on the same IP by fuzzing the <code>Host:<\/code> header (works even when DNS has no record, unlike subdomain fuzzing which relies on public DNS resolution).","children":[],"payload":{"tag":"li","lines":"43,44"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>ffuf -w wordlist.txt:FUZZ -u http://academy.htb:PORT/ -H &apos;Host: FUZZ.academy.htb&apos; -fs xxx<\/code> &#x2014; VHost fuzzing (filter default-page size)","children":[],"payload":{"tag":"li","lines":"45,47"}}],"payload":{"tag":"li","lines":"44,47"}}],"payload":{"tag":"h3","lines":"42,43"}},{"content":"Filtering Results","children":[{"content":"Reduce noise by matching/filtering on size, words, lines, or status codes.","children":[],"payload":{"tag":"li","lines":"48,49"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>-fs xxx<\/code> &#x2014; filter out responses of size xxx (also <code>-fc<\/code> status code, <code>-fw<\/code> word count, <code>-fl<\/code> line count; <code>-mc<\/code> matches codes)","children":[],"payload":{"tag":"li","lines":"50,52"}}],"payload":{"tag":"li","lines":"49,52"}}],"payload":{"tag":"h3","lines":"47,48"}},{"content":"Parameter Fuzzing - GET","children":[{"content":"Discover hidden GET parameters accepted by a page.","children":[],"payload":{"tag":"li","lines":"53,54"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>ffuf -w wordlist.txt:FUZZ -u http://admin.academy.htb:PORT/admin/admin.php?FUZZ=key -fs xxx<\/code> &#x2014; GET parameter fuzzing","children":[],"payload":{"tag":"li","lines":"55,56"}},{"content":"<code>/opt/useful/seclists/Discovery/Web-Content/burp-parameter-names.txt<\/code> &#x2014; parameters wordlist","children":[],"payload":{"tag":"li","lines":"56,58"}}],"payload":{"tag":"li","lines":"54,58"}}],"payload":{"tag":"h3","lines":"52,53"}},{"content":"Parameter Fuzzing - POST","children":[{"content":"Discover hidden POST body parameters.","children":[],"payload":{"tag":"li","lines":"59,60"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>ffuf -w wordlist.txt:FUZZ -u http://admin.academy.htb:PORT/admin/admin.php -X POST -d &apos;FUZZ=key&apos; -H &apos;Content-Type: application/x-www-form-urlencoded&apos; -fs xxx<\/code> &#x2014; POST parameter fuzzing","children":[],"payload":{"tag":"li","lines":"61,63"}}],"payload":{"tag":"li","lines":"60,63"}}],"payload":{"tag":"h3","lines":"58,59"}},{"content":"Value Fuzzing","children":[{"content":"Once a valid parameter is found, brute-force its accepted values (e.g. IDs).","children":[],"payload":{"tag":"li","lines":"64,65"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>ffuf -w ids.txt:FUZZ -u http://admin.academy.htb:PORT/admin/admin.php -X POST -d &apos;id=FUZZ&apos; -H &apos;Content-Type: application/x-www-form-urlencoded&apos; -fs xxx<\/code> &#x2014; value fuzzing","children":[],"payload":{"tag":"li","lines":"66,67"}},{"content":"<code>for i in &#x24;(seq 1 1000); do echo &#x24;i &gt;&gt; ids.txt; done<\/code> &#x2014; create a sequential value wordlist","children":[],"payload":{"tag":"li","lines":"67,69"}}],"payload":{"tag":"li","lines":"65,69"}}],"payload":{"tag":"h3","lines":"63,64"}},{"content":"General Commands","children":[{"content":"<code>sudo sh -c &apos;echo &quot;SERVER_IP academy.htb&quot; &gt;&gt; /etc/hosts&apos;<\/code> &#x2014; add DNS entry to /etc/hosts (needed for subdomain/vhost access)","children":[],"payload":{"tag":"li","lines":"70,71"}},{"content":"<code>curl http://admin.academy.htb:PORT/admin/admin.php -X POST -d &apos;id=key&apos; -H &apos;Content-Type: application/x-www-form-urlencoded&apos;<\/code> &#x2014; manually confirm a finding with curl POST","children":[],"payload":{"tag":"li","lines":"71,73"}}],"payload":{"tag":"h3","lines":"69,70"}}],"payload":{"tag":"h2","lines":"7,8"}},{"content":"&#x1f6e0;&#xfe0f; Key Tools &amp; Concepts","children":[{"content":"ffuf &#x2014; fast web fuzzer; the <code>FUZZ<\/code> keyword marks the injection point","children":[],"payload":{"tag":"li","lines":"74,75"}},{"content":"<code>-w<\/code> &#x2014; wordlist (append <code>:FUZZ<\/code> to name the keyword), <code>-u<\/code> URL, <code>-X<\/code> method, <code>-d<\/code> POST data, <code>-H<\/code> custom header, <code>-e<\/code> extensions, <code>-recursion<\/code>/<code>-recursion-depth<\/code>","children":[],"payload":{"tag":"li","lines":"75,76"}},{"content":"Filtering flags &#x2014; <code>-fs<\/code>/<code>-fc<\/code>/<code>-fw<\/code>/<code>-fl<\/code> filter and <code>-mc<\/code> match by size/code/words/lines","children":[],"payload":{"tag":"li","lines":"76,77"}},{"content":"SecLists &#x2014; wordlist collection: directory-list for dirs/pages, web-extensions for extensions, subdomains-top1million for DNS, burp-parameter-names for params","children":[],"payload":{"tag":"li","lines":"77,78"}},{"content":"Subdomain vs VHost &#x2014; subdomain fuzzing resolves via public DNS; VHost fuzzing manipulates the Host header to reach non-public hosts on the same IP","children":[],"payload":{"tag":"li","lines":"78,79"}},{"content":"/etc/hosts &#x2014; map discovered vhosts/subdomains to the target IP","children":[],"payload":{"tag":"li","lines":"79,80"}}],"payload":{"tag":"h2","lines":"73,74"}}],"payload":{"tag":"h1","lines":"0,1"}}
