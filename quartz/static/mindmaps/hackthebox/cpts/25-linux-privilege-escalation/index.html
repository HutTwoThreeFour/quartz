    const data = {"content":"Linux Privilege Escalation","children":[{"content":"&#x1f3af; Main Idea","children":[{"content":"Escalate from a low-privileged shell to <strong>root<\/strong> on a Linux host by abusing misconfigurations, weak permissions, and vulnerable software.","children":[],"payload":{"tag":"li","lines":"2,3"}},{"content":"Enumeration is the key: OS/kernel version, running services, SUID/SGID, sudo rights, cron jobs, writable files, credentials.","children":[],"payload":{"tag":"li","lines":"3,4"}},{"content":"Full root compromise enables traffic capture, sensitive file access, and (if domain-joined) pivoting into Active Directory.","children":[],"payload":{"tag":"li","lines":"4,6"}}],"payload":{"tag":"h2","lines":"1,2"}},{"content":"&#x1f4a5; Attack / Exploit Vectors","children":[{"content":"Environment &amp; Service Enumeration","children":[{"content":"Baseline recon to spot escalation paths (processes, users, networking, packages, mounts).","children":[],"payload":{"tag":"li","lines":"9,10"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>ps aux | grep root<\/code> &#x2014; see processes running as root","children":[],"payload":{"tag":"li","lines":"11,12"}},{"content":"<code>ps au<\/code> &#x2014; see logged-in users","children":[],"payload":{"tag":"li","lines":"12,13"}},{"content":"<code>ls /home<\/code> &#x2014; view user home directories","children":[],"payload":{"tag":"li","lines":"13,14"}},{"content":"<code>ls -l ~/.ssh<\/code> &#x2014; check for SSH keys","children":[],"payload":{"tag":"li","lines":"14,15"}},{"content":"<code>history<\/code> &#x2014; review Bash history","children":[],"payload":{"tag":"li","lines":"15,16"}},{"content":"<code>lsblk<\/code> &#x2014; find unmounted file systems/drives","children":[],"payload":{"tag":"li","lines":"16,17"}},{"content":"<code>uname -a<\/code> &#x2014; check kernel version","children":[],"payload":{"tag":"li","lines":"17,18"}},{"content":"<code>cat /etc/lsb-release<\/code> & trong>Commands<\/strong>","children":[{"content":"<code>echo &#x24;PATH<\/code> &#x2014; inspect current PATH","children":[],"payload":{"tag":"li","lines":"37,38"}},{"content":"<code>PATH=.:&#x24;{PATH}<\/code> &#x2014; add <code>.<\/code> to the start of PATH","children":[],"payload":{"tag":"li","lines":"38,40"}}],"payload":{"tag":"li","lines":"36,40"}}],"payload":{"tag":"h3","lines":"34,35"}},{"content":"Wildcard Abuse","children":[{"content":"Inject command-line flags via filenames when a script/cron uses unquoted wildcards (e.g. tar, chown).","children":[],"payload":{"tag":"li","lines":"41,42"}},{"content":"Create files named like options (e.g. <code>--checkpoint<\/code>, <code>--checkpoint-action=exec=...<\/code>) to force execution.","children":[],"payload":{"tag":"li","lines":"42,44"}}],"payload":{"tag":"h3","lines":"40,41"}},{"content":"Escaping Restricted Shells","children":[{"content":"Break out of rbash/rksh-style restricted shells to a full shell.","children":[],"payload":{"tag":"li","lines":"45,46"}},{"content":"Techniques: abuse allowed binaries (vi/vim, awk, find, ed), environment variables, and command injection to spawn <code>/bin/sh<\/code>.","children":[],"payload":{"tag":"li","lines":"46,48"}}],"payload":{"tag":"h3","lines":"44,45"}},{"content":"Special Permissions (SUID / SGID)","children":[{"content":"SUID/SGID binaries run with the owner&apos;s (often root) privileges; abuse via GTFOBins.","children":[],"payload":{"tag":"li","lines":"49,50"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>find / -user root -perm -4000 -exec ls -ldb {} \\; 2&gt;/dev/null<\/code> &#x2014; find SUID binaries","children":[],"payload":{"tag":"li","lines":"51,52"}},{"content":"<code>find / -user root -perm -6000 -exec ls -ldb {} \\; 2&gt;/dev/null<\/code> &#x2014; find SETGID binaries","children":[],"payload":{"tag":"li","lines":"52,54"}}],"payload":{"tag":"li","lines":"50,54"}}],"payload":{"tag":"h3","lines":"48,49"}},{"content":"Sudo Rights eged<\/code>, exposed <code>docker.sock<\/code>.","children":[],"payload":{"tag":"li","lines":"90,92"}}],"payload":{"tag":"h3","lines":"88,89"}},{"content":"Kubernetes","children":[{"content":"Abuse exposed kubelet/API, service-account tokens, and privileged pods to escalate/escape.","children":[],"payload":{"tag":"li","lines":"93,94"}},{"content":"Deploy a pod mounting the host filesystem or with privileged securityContext.","children":[],"payload":{"tag":"li","lines":"94,96"}}],"payload":{"tag":"h3","lines":"92,93"}},{"content":"Logrotate Abuse (Logrotten)","children":[{"content":"Race logrotate&apos;s handling of writable logs to execute a payload as root.","children":[],"payload":{"tag":"li","lines":"97,99"}}],"payload":{"tag":"h3","lines":"96,97"}},{"content":"Shared Libraries &#x2014; LD_PRELOAD / LD_LIBRARY_PATH","children":[{"content":"Preload a malicious shared object when a sudo-allowed binary preserves env vars.","children":[],"payload":{"tag":"li","lines":"100,101"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>ldd /bin/ls<\/code> &#x2014; view shared objects a binary requires","children":[],"payload":{"tag":"li","lines":"102,103"}},{"content":"<code>gcc src.c -fPIC -shared -o /development/libshared.so<\/code> &#x2014; compile a malicious shared library","children":[],"payload":{"tag":"li","lines":"103,104"}},{"content":"<code>sudo LD_PRELOAD=/tmp/root.so /usr/sbin/apache2 restart<\/code> &#x2014; escalate via LD_PRELOAD","children":[],"payload":{"tag":"li","lines":"104,106"}}],"payload":{"tag":"li","lines":"101,106"}}],"payload":{"tag":"h3","lines":"99,100"}},{"content":"Shared Object Hijacking (RUNPATH)","children":[{"content":"Plant a malicious <code>.so<\/code> in a writable RUNPATH directory that a SUID/root binary loads.","children":[],"payload":{"tag":"li","lines":"107,108"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>readelf -d payroll | grep PATH<\/code> &#x2014; check the RUNPATH of a binary",
